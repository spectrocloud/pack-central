{{- if not .Values.existingSecret }}
{{- $key := required "set enrollmentKey to the enrollment key from the Lava console (--set-file enrollmentKey=<file>), or name a Secret holding it in existingSecret" .Values.enrollmentKey | toString | trim }}
{{- if not (contains ":" $key) }}{{ fail "enrollmentKey must be the whole key from the Lava console, client_id:client_secret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lava-sensor.secretName" . }}
  labels: {{- include "lava-sensor.labels" . | nindent 4 }}
type: Opaque
stringData:
  enrollment-key: {{ $key | quote }}
{{- end }}
