pack:
  content:
    images:
      - image: docker.io/grafana/loki:3.7.7
      - image: docker.io/grafana/loki-canary:3.7.7
      - image: docker.io/grafana/loki-helm-test:3.7.7
      - image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
      - image: ghcr.io/jkroepke/access-log-exporter:0.4.12
      - image: docker.io/memcached:1.6.45-alpine
      - image: quay.io/prometheus/memcached-exporter:v0.17.0
      - image: docker.io/kiwigrid/k8s-sidecar:2.10.3
      - image: registry.k8s.io/kubectl:v1.37.0

    charts:
      - repo: https://grafana-community.github.io/helm-charts
        name: loki
        version: 18.11.7
  namespace: "loki"

charts:
  loki:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false
      image:
        registry: docker.io
        repository: grafana/loki
        tag: 3.7.7
      limits_config:
        allow_structured_metadata: true
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage_config:
        tsdb_shipper:
          active_index_directory: /var/loki/tsdb-index
          cache_location: /var/loki/tsdb-cache
          cache_ttl: 24h
        bloom_shipper:
          working_directory: /var/loki/bloom

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 5Gi

    gateway:
      enabled: true
      image:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged
        tag: 1.31-alpine

    lokiCanary:
      image:
        registry: docker.io
        repository: grafana/loki-canary
        tag: 3.7.7

    test:
      image:
        registry: docker.io
        repository: grafana/loki-helm-test
        tag: 3.7.7

    memcached:
      image:
        registry: docker.io
        repository: memcached
        tag: 1.6.45-alpine

    memcachedExporter:
      image:
        registry: quay.io
        repository: prometheus/memcached-exporter
        tag: v0.17.0

    sidecar:
      image:
        registry: docker.io
        repository: kiwigrid/k8s-sidecar
        tag: 2.10.3

    # Desactivar componentes distribuidos no requeridos en SingleBinary
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0