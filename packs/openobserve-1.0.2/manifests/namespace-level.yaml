              },
              "queryType": "promql",
              "queries": [
                {
                  "query": "sum by (namespace) (\n  rate(container_cpu_usage_seconds_total{cluster=\"$cluster\"}[5m])\n)\n/\nsum by (namespace) (\n  kube_pod_container_resource_requests{cluster=\"$cluster\", resource=\"cpu\"}\n)",
