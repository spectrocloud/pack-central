presets:
  - name: "powerflex-v2180"
    displayName: "PowerFlex v2.18.0"
    group: "Platform"
    remove:
    - "charts.csm-operator.csm"
    - "charts.csm-operator.storageclass"
    add: |
      charts:
        csm-operator:
          image:
            repository: quay.io/dell/container-storage-modules/dell-csm-operator
            pullPolicy: IfNotPresent
            tag: "v1.13.2"

          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi

          csm:
            # Select a preset to populate the default configuration for your platform
            namespace: vxflexos
            type: powerflex
            version: v1.18.2

            config:
              version: v1.18.2
              secret:
                encoded: false # if set to true, provide a base64 encoded value instead
                # Default secret names:
                # PowerFlex:  vxflexos-config
                # PowerMax:   powermax-creds
                # PowerStore: powerstore-config
                # PowerScale: isilon-creds
                name: vxflexos-config
                value: |
                  - username: "admin"
                    password: "Password123"
                    systemID: "2b11bb111111bb1b"
                    endpoint: "https://127.0.0.2"
                    skipCertificateValidation: true
                    mdm: "10.0.0.3,10.0.0.4"
                    AllSystemNames: "name1,name2"

                # Example value for encoded
                # value: LSB1c2VybmFtZTogImFkbWluIgogIHBhc3N3b3JkOiAiUGFzc3dvcmQxMjMiCiAgc3lzdGVtSUQ6ICIyYjExYmIxM...

                # username: "admin"
                # Username for accessing PowerFlex system.
                # If authorization is enabled, username will be ignored.

                # password: "password"
                # Password for accessing PowerFlex system.
                # If authorization is enabled, password will be ignored.

                # systemID: "1a99aa999999aa9a"
                # Required: true
                # System name/ID of PowerFlex system.	

                # endpoint: "https://127.0.0.1"
                # REST API gateway HTTPS endpoint for PowerFlex system.
                # If authorization is enabled, endpoint should be the HTTPS localhost endpoint that 
                # the authorization sidecar will listen on

                # skipCertificateValidation: true 
                # Determines if the driver is going to validate certs while connecting to PowerFlex REST API interface.
                # Allowed values: true or false
                # Default value: true

                # isDefault: true
                # indicates if this array is the default array
                # needed for backwards compatibility
                # only one array is allowed to have this set to true 
                # Default value: false

                # mdm: "10.0.0.1,10.0.0.2"
                # defines the MDM(s) that SDC should register with on start.
                # Allowed values:  a list of IP addresses or hostnames separated by comma.
                # Default value: none

                # allSystemNames: "pflex-1,pflex-2"
                # Required: false
                # Previous names used in secret of PowerFlex system. Only needed if PowerFlex System Name has been changed by user 
                # and old resources are still based on the old name.

              driver:
                csiDriverType: "powerflex"
                csiDriverSpec:
                  # in OCP <= 4.16 and K8s <= 1.29, fsGroupPolicy is an immutable field
                  # fsGroupPolicy: Defines if the underlying volume supports changing ownership and permission of the volume before being mounted.
                  # Allowed values: ReadWriteOnceWithFSType, File , None
                  # Default value: File
                  fSGroupPolicy: "File"
                  # storageCapacity: Helps the scheduler to schedule the pod on a node satisfying the topology constraints, only if the requested capacity is available on the storage array
                  # Allowed values:
                  #   true: enable storage capacity tracking
                  #   false: disable storage capacity tracking
                  storageCapacity: true
                replicas: 1
                dnsPolicy: ClusterFirstWithHostNet
                forceRemoveDriver: true
                common:
                  imagePullPolicy: IfNotPresent
                  envs:
                    - name: X_CSI_VXFLEXOS_ENABLELISTVOLUMESNAPSHOT
                      value: "false"
                    - name: X_CSI_VXFLEXOS_ENABLESNAPSHOTCGDELETE
                      value: "false"
                    # Log level for CSI driver, passed to logrus.
                    # Options are "panic", "fatal", "error", "warn", "info",
                    # "debug", and "trace".
                    - name: CSI_LOG_LEVEL
                      value: "info"
                    # CSI driver log format
                    # Allowed values: "text" or "json"
                    # Default value: "json"
                    - name: CSI_LOG_FORMAT
                      value: "json"
                    # Specify kubelet config dir path.
                    # Ensure that the config.yaml file is present at this path.
                    # Default value: /var/lib/kubelet
                    - name: KUBELET_CONFIG_DIR
                      value: "/var/lib/kubelet"
                    - name: "CERT_SECRET_COUNT"
                      value: "0"
                    - name: X_CSI_QUOTA_ENABLED
                      value: "false"
                    # CSI driver interface names for NFS deployment without SDC
                    # Multiple interface names should be separated by comma
                    # Ensure to single quote the whole value and double quote each interface name
                    # Examples: 'worker1: "interface1",worker2: "interface2"'
                    # Default value: None, required only when X_CSI_SDC_ENABLED is set to false
                    - name: INTERFACE_NAMES
                      value:
                    # X_CSI_PROBE_TIMEOUT: Specify the timeout limit for controller and node to communicate with the array.
                    # Allowed values: 1s, 10s, etc.
                    # In the format of a duration.
                    # Default value: 10s
                    - name: X_CSI_PROBE_TIMEOUT
                      value: "10s"
                    # X_CSI_AUTH_TYPE: Specify the authentication type to be used.
                    # Allowed values: OIDC, "" empty
                    - name: X_CSI_AUTH_TYPE
                      value: ""
                    # X_CSI_FS_CHECK_ENABLED: Enable/disable file system check feature.
                    # Allowed values:
                    #    true: enable FSCK Check before mounting a volume.
                    #    false: disable FSCK Check while mounting a volume.
                    # Default value: false
                    - name: X_CSI_FS_CHECK_ENABLED
                      value: "false"
                    # X_CSI_FS_CHECK_MODE: Controls if automatic repair should be done when repairable errors are found.
                    # Allowed values: checkOnly, checkAndRepair
                    # Default value: checkOnly
                    - name: X_CSI_FS_CHECK_MODE
                      value: "checkOnly"
                    # X_CSI_SPACE_RECLAMATION_ENABLED: Enable/Disable space reclamation
                    # Allowed values:
                    #    true: enable space reclamation.
                    #    false: disable space reclamation.
                    # Default value: false
                    - name: X_CSI_SPACE_RECLAMATION_ENABLED
                      value: "false"
                    # X_CSI_SPACE_RECLAMATION_SCHEDULE: Cron expression for reclamation schedule
                    - name: X_CSI_SPACE_RECLAMATION_SCHEDULE
                      value: "0 2 * * 0"
                    # X_CSI_SPACE_RECLAMATION_MAX_CONCURRENT: Max number of concurrent reclamation operations per node
                    - name: X_CSI_SPACE_RECLAMATION_MAX_CONCURRENT
                      value: "2"
                    # X_CSI_SPACE_RECLAMATION_TIMEOUT: TimeOut in Seconds
                    - name: X_CSI_SPACE_RECLAMATION_TIMEOUT
                      value: "14400"
                sideCars:
                  # 'csivol' represents a string prepended to each volume created by the CSI driver
                  - name: provisioner
                    args: ["--volume-name-prefix=csivol"]
                  - name: snapshotter
                    args: ["--feature-gates=CSIVolumeGroupSnapshot=false"]
                    # sdc-monitor is disabled by default, due to high CPU usage
                  - name: sdc-monitor
                    enabled: false
                    envs:
                      - name: HOST_PID
                        value: "1"
                        # health monitor is disabled by default, refer to driver documentation before enabling it
                        # Also set the env variable controller.envs.X_CSI_HEALTH_MONITOR_ENABLED  to "true".
                        # Default monitor-interval: 60s
                  - name: csi-external-health-monitor-controller
                    enabled: false
                    args: ["--monitor-interval=60s"]
                # Uncomment the following to configure how often external-provisioner polls the driver to detect changed capacity
                # Configure when the storageCapacity is set as "true"
                # Allowed values: 1m,2m,3m,...,10m,...,60m etc. Default value: 5m
                # - name: provisioner
                #  args: ["--capacity-poll-interval=5m"]

                controller:
                  envs:
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from Controller plugin - volume condition.
                    # Install the 'external-health-monitor' sidecar accordingly.
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_POWERFLEX_EXTERNAL_ACCESS: Allows to specify additional entries for hostAccess of NFS volumes. Both single IP address and subnet are valid entries.
                    # Allowed Values: x.x.x.x/xx or x.x.x.x
                    # Default Value: None
                    - name: X_CSI_POWERFLEX_EXTERNAL_ACCESS
                      value:
                  # "controller.nodeSelector" defines what nodes would be selected for pods of controller deployment
                  # Leave as blank to use all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
                  #  node-role.kubernetes.io/master: ""
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # "controller.tolerations" defines tolerations that would be applied to controller deployment
                  # Leave as blank to install controller on worker nodes
                  # Default value: None
                  tolerations:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
                  # - key: "node-role.kubernetes.io/master"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  # - key: "node-role.kubernetes.io/control-plane"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                node:
                  envs:
                    # X_CSI_SDC_ENABLED: Enable/Disable SDC
                    # Allowed values:
                    #    true: enable SDC
                    #    false: disable SDC
                    # Default value: true
                    - name: X_CSI_SDC_ENABLED
                      value: "true"
                    # X_CSI_APPROVE_SDC_ENABLED: Enables/Disable SDC approval
                    # Allowed values:
                    #    true: enable SDC approval based on either GUID or IP address, depending on the restricted SDC mode configured in PowerFlex system
                    #    false: disable SDC approval based on either GUID or IP address, depending on the restricted SDC mode configured in PowerFlex system
                    # Default value: false
                    - name: X_CSI_APPROVE_SDC_ENABLED
                      value: "false"
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from node plugin - volume usage
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_RENAME_SDC_ENABLED: Enable/Disable rename of SDC
                    # Allowed values:
                    #   true: enable renaming
                    #   false: disable renaming
                    # Default value: false
                    - name: X_CSI_RENAME_SDC_ENABLED
                      value: "false"
                    # X_CSI_RENAME_SDC_PREFIX: defines a string for prefix of the SDC name.
                    # "prefix" + "worker_node_hostname" should not exceed 31 chars.
                    # Default value: none
                    # Examples: "rhel-sdc", "sdc-test"
                    - name: X_CSI_RENAME_SDC_PREFIX
                      value: ""
                    # X_CSI_TRIM_SDC_NAME_ENABLED: Enable/Disable truncation of SDC name to 31 characters (PowerFlex limit)
                    # Allowed values:
                    #   true: enable truncation when SDC name exceeds 31 characters
                    #   false: disable truncation (may cause PowerFlex API error if name > 31 chars)
                    # Default value: false
                    - name: X_CSI_TRIM_SDC_NAME_ENABLED
                      value: "false"
                    # X_CSI_MAX_VOLUMES_PER_NODE: Defines the maximum PowerFlex volumes that can be created per node
                    # Allowed values: Any value greater than or equal to 0
                    # If value is zero Container Orchestrator shall decide how many volumes of this type can be published by the controller to the node.
                    # This limit is applicable to all the nodes in the cluster for which node label 'maxVxflexosVolumesPerNode' is not set.
                    # Default value: "0"
                    - name: X_CSI_MAX_VOLUMES_PER_NODE
                      value: "0"
                    # X_CSI_SDC_SFTP_REPO_ENABLED: Enable/Disable SDC SFTP repository
                    - name: X_CSI_SDC_SFTP_REPO_ENABLED
                      value: "false"
                  # "node.nodeSelector" defines what nodes would be selected for pods of node daemonset
                  # Leave as blank to use all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
                  #  node-role.kubernetes.io/master: ""
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # "node.tolerations" defines tolerations that would be applied to node daemonset
                  # Leave as blank to install node driver only on worker nodes
                  # Default value: None
                  tolerations:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/master taint
                  # - key: "node-role.kubernetes.io/master"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  # - key: "node-role.kubernetes.io/control-plane"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                  # Uncomment if CSM for Resiliency and CSI Driver pods monitor is enabled
                  #  - key: "offline.vxflexos.storage.dell.com"
                  #    operator: "Exists"
                  #    effect: "NoSchedule"
                  #  - key: "vxflexos.podmon.storage.dell.com"
                  #    operator: "Exists"
                  #    effect: "NoSchedule"
                initContainers:
                  - imagePullPolicy: IfNotPresent
                    name: sdc
                    envs:
                      # HOST_DRV_CFG_PATH: Specifies the host path where the SDC drv_cfg utility is installed on the node.
                      # Defaults to "/opt/emc/scaleio/sdc/bin". Override this if host uses a different installation path.
                      - name: HOST_DRV_CFG_PATH
                        value: "/opt/emc/scaleio/sdc/bin"
                      - name: REPO_ADDRESS
                        value: "sftp://0.0.0.0" # SFTP/private repository address. Format: "protocol://address"
                      - name: REPO_USER
                        value: "sdcRepoUser" # provide username to authenticate to the SFTP repo
                      - name: MODULE_SIGCHECK
                        value: "0"
                # metrics: configures the Prometheus metrics endpoint and gateway monitoring on the controller
                metrics:
                  # enabled: Enable/Disable the shared Prometheus metrics HTTP endpoint on the controller
                  # Default value: false
                  enabled: false
                  # port: Port on which the metrics endpoint is exposed
                  # Allowed values: any valid port number
                  # Default value: 9090
                  port: 9090
                  # tlsCertSecret: Name of a Kubernetes TLS Secret to enable HTTPS on the metrics endpoint
                  # Leave empty to use plain HTTP
                  # Default value: ""
                  tlsCertSecret: ""
                  # gatewayMonitoring: configures PowerFlex Gateway health monitoring (PowerFlex specific)
                  gatewayMonitoring:
                    # enabled: Enable/Disable Gateway health monitoring on the controller
                    # Requires metrics.enabled to be true
                    # Default value: false
                    enabled: false
                    # leaderElectionEnabled: Enable/Disable leader election so only one controller replica probes gateways
                    # Allowed values: true, false
                    # Default value: true
                    leaderElectionEnabled: true
                    # pollInterval: How frequently the leader controller polls each gateway endpoint
                    # Allowed values: duration string (e.g., "10s", "30s", "1m")
                    # Default value: 30s
                    pollInterval: "30s"
                  # serviceMonitor: configures a Prometheus Operator ServiceMonitor for automatic scrape discovery
                  serviceMonitor:
                    # enabled: Create a ServiceMonitor CR for Prometheus Operator integration
                    # Requires the Prometheus Operator CRDs to be installed in the cluster
                    # Default value: false
                    enabled: false
                    # interval: Prometheus scrape interval
                    # Allowed values: duration string (e.g., "15s", "30s", "1m")
                    # Default value: 30s
                    interval: "30s"
                    # scrapeTimeout: Prometheus scrape timeout for the metrics endpoint
                    # Default value: "" (unset)
                    scrapeTimeout: ""
                    # insecureSkipVerify: Skip TLS certificate verification when Prometheus scrapes the metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    insecureSkipVerify: false
                  # podMonitor: configures a Prometheus Operator PodMonitor for node pods
                  podMonitor:
                    # enabled: Create a PodMonitor CR for Prometheus Operator integration
                    # Requires the Prometheus Operator CRDs to be installed in the cluster
                    # Default value: false
                    enabled: false
                    # interval: Prometheus scrape interval for node pods
                    # Allowed values: duration string (e.g., "15s", "30s", "1m")
                    # Default value: 30s
                    interval: "30s"
                    # scrapeTimeout: Prometheus scrape timeout for the node metrics endpoint
                    # Default value: "" (unset)
                    scrapeTimeout: ""
                    # insecureSkipVerify: Skip TLS certificate verification when Prometheus scrapes node metrics
                    # Allowed values: true, false
                    # Default value: false
                    insecureSkipVerify: false
                  # prometheusRule: Creates a Prometheus Operator PrometheusRule containing PowerFlex CSI alert rules.
                  prometheusRule:
                    # enabled: Enable/Disable PrometheusRule creation for driver alerts
                    # Requires the Prometheus Operator CRDs to be installed in the cluster
                    # Allowed values: true, false
                    # Default value: false
                    enabled: true
                    # restartCountThreshold: Pod restart count within a 15-minute window that triggers a crash-loop alert (PF-10)
                    # Default value: 3
                    restartCountThreshold: 3
                    # cpuWarningThreshold: Warning threshold for driver CPU utilization in whole percent (PF-11)
                    # Default value: 80
                    cpuWarningThreshold: 80
                    # memoryWarningThreshold: Warning threshold for driver memory usage in bytes; 2147483648 = 2 GiB (PF-12)
                    # Default value: 2147483648
                    memoryWarningThreshold: 2147483648
                    # poolCapacityWarningPercent: Warning threshold for storage pool utilization in whole percent (PF-13)
                    # Default value: 80
                    poolCapacityWarningPercent: 80
                    # poolCapacityCriticalPercent: Critical threshold for storage pool utilization in whole percent (PF-14)
                    # Default value: 90
                    poolCapacityCriticalPercent: 90
                    # thinRatioWarningThreshold: Thin-provisioning over-commitment ratio that triggers a warning alert (PF-15)
                    # Default value: "0.8"
                    thinRatioWarningThreshold: "0.8"
                    # dataReductionDegradedThreshold: Data reduction ratio below which a degradation alert fires (PF-16)
                    # Default value: "1.5"
                    dataReductionDegradedThreshold: "1.5"
                    # rcgLagWarningSeconds: Persistent RCG replication lag in seconds that triggers a warning alert (PF-20)
                    # Default value: 300
                    rcgLagWarningSeconds: 300
                    # rcgBandwidthWarningKBps: RCG transmit bandwidth in KB/s below which a degradation alert fires (PF-21)
                    # Default value: 10240
                    rcgBandwidthWarningKBps: 10240
                    # rcgLatencyWarningSeconds: RCG transmit latency in seconds that triggers a warning alert (PF-22)
                    # Default value: "5.0"
                    rcgLatencyWarningSeconds: "5.0"
              modules:
                # Authorization: enable csm-authorization for RBAC
                - name: authorization
                  # enabled: Enable/Disable csm-authorization
                  enabled: false
                  components:
                    - name: karavi-authorization-proxy
                      envs:
                        # proxyHost: hostname of the csm-authorization server
                        # Default value: none
                        - name: "PROXY_HOST"
                          value: "csm-authorization.com"
                        # skipCertificateValidation: Enable/Disable certificate validation of the csm-authorization server
                        # Default value: "true"
                        - name: "SKIP_CERTIFICATE_VALIDATION"
                          value: "true"
                # observability: allows to configure observability
                - name: observability
                  # enabled: Enable/Disable observability
                  # Default value: false
                  enabled: false
                  components:
                    - name: otel-collector
                      # enabled: Enable/Disable OpenTelemetry Collector
                      # Default value: false
                      enabled: false
                      # certificate: base64-encoded certificate for cert/private-key pair -- add cert here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      certificate: ""
                      # privateKey: base64-encoded private key for cert/private-key pair -- add private key here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      privateKey: ""
                    # enabled: Enable/Disable cert-manager
                    # Allowed values:
                    #   true: enable deployment of cert-manager
                    #   false: disable deployment of cert-manager only if it's already deployed
                    # Default value: false
                    - name: cert-manager
                      enabled: false
                    - name: metrics-powerflex
                      # enabled: Enable/Disable PowerFlex metrics
                      # Default value: false
                      enabled: false
                      envs:
                        # POWERFLEX_MAX_CONCURRENT_QUERIES: set the default max concurrent queries to PowerFlex
                        # Allowed values: int
                        # Default value: 10
                        - name: "POWERFLEX_MAX_CONCURRENT_QUERIES"
                          value: "10"
                        # POWERFLEX_SDC_METRICS_ENABLED: enable/disable collection of sdc metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERFLEX_SDC_METRICS_ENABLED"
                          value: "true"
                        # POWERFLEX_VOLUME_METRICS_ENABLED: enable/disable collection of volume metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERFLEX_VOLUME_METRICS_ENABLED"
                          value: "true"
                        # POWERFLEX_STORAGE_POOL_METRICS_ENABLED: enable/disable collection of storage pool metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERFLEX_STORAGE_POOL_METRICS_ENABLED"
                          value: "true"
                        # POWERFLEX_SDC_IO_POLL_FREQUENCY: set polling frequency to get sdc metrics data
                        # Allowed values: int
                        # Default value: 10
                        - name: "POWERFLEX_SDC_IO_POLL_FREQUENCY"
                          value: "10"
                        # POWERFLEX_VOLUME_IO_POLL_FREQUENCY: set polling frequency to get volume metrics data
                        # Allowed values: int
                        # Default value: 10
                        - name: "POWERFLEX_VOLUME_IO_POLL_FREQUENCY"
                          value: "10"
                        # POWERFLEX_STORAGE_POOL_POLL_FREQUENCY: set polling frequency to get Quota capacity metrics data
                        # Allowed values: int
                        # Default value: 10
                        - name: "POWERFLEX_STORAGE_POOL_POLL_FREQUENCY"
                          value: "10"
                        # POWERFLEX_TOPOLOGY_METRICS_ENABLED: enable/disable collection of topology metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERFLEX_TOPOLOGY_METRICS_ENABLED"
                          value: "true"
                        # POWERFLEX_TOPOLOGY_METRICS_POLL_FREQUENCY: set polling frequency to get topology metrics data
                        # Allowed values: int
                        # Default value: 30
                        - name: "POWERFLEX_TOPOLOGY_METRICS_POLL_FREQUENCY"
                          value: "30"
                        # PowerFlex metrics log level
                        # Valid values: trace, debug, info, warn, error, fatal, panic
                        # Default value: "info"
                        - name: "POWERFLEX_LOG_LEVEL"
                          value: "info"
                        # PowerFlex Metrics Output logs in the specified format
                        # Valid values: text, json
                        # Default value: "json"
                        - name: "POWERFLEX_LOG_FORMAT"
                          value: "json"
                        # Otel collector address
                        # Allowed values: String
                        # Default value: "otel-collector:55680"
                        - name: "COLLECTOR_ADDRESS"
                          value: "otel-collector:55680"
                  # metrics: Configure the observability self-metrics endpoint on the karavi-metrics-powerflex
                  metrics:
                    # enabled: Enable/Disable observability self-metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by observability self-metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8443
                    port: 8443
                    # tlsCertSecret: Name of secret containing TLS certificate and key for observability self-metrics
                    # Allowed values: Kubernetes secret name, empty string
                    # Default value: ""
                    tlsCertSecret: ""
                    # serviceMonitor: Configure ServiceMonitor for observability self-metrics
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor creation for observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Prometheus scrape interval for observability self-metrics
                      # Allowed values: duration string (for example: 15s, 30s, 1m)
                      # Default value: "30s"
                      interval: "30s"
                      # scrapeTimeout: Prometheus scrape timeout for observability self-metrics
                      # Allowed values: duration string, empty string
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS certificate verification while scraping observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Configure Prometheus Operator PrometheusRule for observability alerts
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for observability alerts
                      # Allowed values: true, false
                      # Default value: false
                      enabled: true
                # Replication: allows to configure replication
                # Replication CRDs must be installed before installing driver
                - name: replication
                  # enabled: Enable/Disable replication feature
                  # Allowed values:
                  #   true: enable replication feature(install dell-csi-replicator sidecar)
                  #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                  # Default value: false
                  enabled: false
                  metrics:
                    enabled: false
                    port: 8445
                    tlsCertSecret: ""
                    collection:
                      interval: "30s"
                    serviceMonitor:
                      enabled: false
                      interval: "30s"
                      scrapeTimeout: ""
                      insecureSkipVerify: false
                  components:
                    - name: dell-csi-replicator
                      envs:
                        # replicationPrefix: prefix to prepend to storage classes parameters
                        # Allowed values: string
                        # Default value: replication.storage.dell.com
                        - name: "X_CSI_REPLICATION_PREFIX"
                          value: "replication.storage.dell.com"
                        # replicationContextPrefix: prefix to use for naming of resources created by replication feature
                        # Allowed values: string
                        - name: "X_CSI_REPLICATION_CONTEXT_PREFIX"
                          value: "powerflex"
                    - name: dell-replication-controller-manager
                      envs:
                        # Replication log level
                        # Allowed values: "error", "warn"/"warning", "info", "debug"
                        # Default value: "info"
                        - name: "REPLICATION_CTRL_LOG_LEVEL"
                          value: "info"
                        # Replication log format
                        # Allowed values: "text", "json"
                        # Default value: "json"
                        - name: "REPLICATION_CTRL_LOG_FORMAT"
                          value: "json"
                        # replicas: Defines number of controller replicas
                        # Allowed values: int
                        # Default value: 1
                        - name: "REPLICATION_CTRL_REPLICAS"
                          value: "1"
                        # retryIntervalMin: Initial retry interval of failed reconcile request.
                        # It doubles with each failure, upto retry-interval-max
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MIN"
                          value: "1s"
                        # RETRY_INTERVAL_MAX: Maximum retry interval of failed reconcile request
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MAX"
                          value: "5m"
                        # DISABLE_PVC_REMAP: Disable PVC remapping for replication in single cluster configuration
                        # Allowed values:
                        #   true: Disable replication feature(install dell-csi-replicator sidecar)
                        #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                        # Default value: false
                        - name: "DISABLE_PVC_REMAP"
                          value: "false"
                        # REPLICATION_ALLOW_PVC_CREATION_ON_TARGET: It Creates PVC on target cluster using replicated PV.
                        # Allowed values:
                        #   true: It creates a PVC on target cluster against replicated PV
                        #   false: simply updates claimref on replicated PV on target cluster without actually creating a PVC
                        # Default value: false
                        - name: "REPLICATION_ALLOW_PVC_CREATION_ON_TARGET"
                          value: "false"
                - name: resiliency
                  # enabled: Enable/Disable Resiliency feature
                  # Allowed values:
                  #   true: enable Resiliency feature(deploy podmon sidecar)
                  #   false: disable Resiliency feature(do not deploy podmon sidecar)
                  # Default value: false
                  enabled: false
                  components:
                    - name: podmon-controller
                      imagePullPolicy: IfNotPresent
                      args:
                        - "--labelvalue=csi-vxflexos"
                        - "--skipArrayConnectionValidation=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        - "--arrayConnectivityPollRate=5"
                        - "--arrayConnectivityConnectionLossThreshold=3"
                        # Below 3 args should not be modified.
                        - "--csisock=unix:/var/run/csi/csi.sock"
                        - "--mode=controller"
                        - "--driver-config-params=/vxflexos-config-params/driver-config-params.yaml"
                    - name: podmon-node
                      imagePullPolicy: IfNotPresent
                      envs:
                        # podmonAPIPort: Defines the port to be used within the kubernetes cluster
                        # Allowed values: Any valid and free port (string)
                        # Default value: 8083
                        - name: "X_CSI_PODMON_API_PORT"
                          value: "8083"
                          # podmonAPIToken: Shared secret token for authenticating podmon API requests
                          # Security note: podmon API uses HTTP; use this only on trusted cluster-internal networks.
                          # Example (literal value):
                          # - name: "X_CSI_PODMON_API_TOKEN"
                          #   value: "<strong-random-token>"
                          # Note: valueFrom.secretKeyRef is not currently supported for this token
                      args:
                        - "--labelvalue=csi-vxflexos"
                        - "--leaderelection=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        - "--arrayConnectivityPollRate=5"
                        # Below 3 args should not be modified.
                        - "--csisock=unix:/var/lib/kubelet/plugins/vxflexos.emc.dell.com/csi_sock"
                        - "--mode=node"
                        - "--driver-config-params=/vxflexos-config-params/driver-config-params.yaml"
                  # metrics: Configure resiliency module metrics endpoint
                  # The operator automatically creates Service/ServiceMonitor/PodMonitor resources for podmon metrics.
                  metrics:
                    # enabled: Enable/Disable resiliency module metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by resiliency module metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8444
                    port: 8444
                    # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
                    # When set the operator mounts the secret and configures HTTPS automatically.
                    # Leave unset to serve metrics over plain HTTP.
                    tlsCertSecret: ""
                    # collection: Controls metrics collection cadence inside the resiliency module.
                    collection:
                      # interval: Interval at which metrics are collected
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                    # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
                    podMonitor:
                      # enabled: Enable/Disable PodMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Creates a Prometheus Operator PrometheusRule containing resiliency alert rules.
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for resiliency alerts
                      # Allowed values: true, false
                      # Default value: true
                      enabled: true
                      # connectivitySuccessRatio: Minimum percentage of successful array connectivity checks
                      # below which the CSMResiliencyConnectivityLost alert fires.
                      # Allowed values: 0-100
                      # Default value: 90
                      connectivitySuccessRatio: 90

          storageclass:
            name: vxflexos
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            provisioner: csi-vxflexos.dellemc.com
            # reclaimPolicy: PVs that are dynamically created by a StorageClass will have the reclaim policy specified here
            # Allowed values:
            #   Reclaim: retain the PV after PVC deletion
            #   Delete: delete the PV after PVC deletion
            # Optional: true
            # Default value: Delete
            reclaimPolicy: Delete
            # allowVolumeExpansion: allows the users to resize the volume by editing the corresponding PVC object
            # Allowed values:
            #   true: allow users to resize the PVC
            #   false: does not allow users to resize the PVC
            # Optional: true
            # Default value: false
            allowVolumeExpansion: true
            parameters:
              # Storage pool to use on system
              # Optional: false
              storagepool: STORAGE_POOL # Insert Storage pool
              # Protection domain that storage pool above belongs to
              # Needed if array has two storagepools that share the same name, but belong to different protection domains
              # Optional: true
              # Uncomment the line below if you want to use protectiondomain
              # protectiondomain: # Insert Protection domain name
              # System you would like this storage class to use
              # Allowed values: one string for system ID
              # Optional: false
              systemID: SYSTEM_ID # Insert System ID
              # format options to pass to mkfs
              # Allowed values: A string dictating the fs options you want passed
              # Optional: true
              # Uncomment the line below if you want to use mkfsFormatOption
              # mkfsFormatOption: "<mkfs_format_option>" # Insert file system format option
              # Filesytem type for volumes created by storageclass
              # Default value: None if defaultFsType is not mentioned in values.yaml
              # Else defaultFsType value mentioned in values.yaml
              # will be used as default value
              csi.storage.k8s.io/fstype: ext4
              # Limit the volume network bandwidth
              # Value is a positive number in granularity of 1024 Kbps; 0 = unlimited
              # Allowed values: one string for bandwidth limit in Kbps
              # Optional: false
              # Uncomment the line below if you want to use bandwidthLimitInKbps
              # bandwidthLimitInKbps: <BANDWIDTH_LIMIT_IN_KBPS> # Insert bandwidth limit in Kbps
              # Limit the volume IOPS
              # The number of IOPS must be greater than 10; 0 = unlimited
              # Allowed values: one string for iops limit
              # Optional: false
              # Uncomment the line below if you want to use iopsLimit
              # iopsLimit: <IOPS_LIMIT> # Insert iops limit
            # volumeBindingMode determines how volume binding and dynamic provisioning should occur
            # Allowed values: 
            #  Immediate: volume binding and dynamic provisioning occurs once PVC is created
            #  WaitForFirstConsumer: delay the binding and provisioning of PV until a pod using the PVC is created.
            #  Optional: false
            # Default value: WaitForFirstConsumer (required for topology section below) 
            volumeBindingMode: WaitForFirstConsumer
            # allowedTopologies helps scheduling pods on worker nodes which match all of below expressions.
            allowedTopologies:
            - matchLabelExpressions:
              - key: csi-vxflexos.dellemc.com/SYSTEM_ID # Insert System ID
                values:
                - csi-vxflexos.dellemc.com

  - name: "powermax-v2180"
    displayName: "PowerMax v2.18.2"
    group: "Platform"
    remove:
    - "charts.csm-operator.csm"
    - "charts.csm-operator.storageclass"
    - "charts.csm-operator.snapshot-controller"
    add: |
      charts:
        csm-operator:
          image:
            repository: quay.io/dell/container-storage-modules/dell-csm-operator
            pullPolicy: IfNotPresent
            tag: "v1.13.2"

          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi

          csm:
            # Select a preset to populate the default configuration for your platform
            namespace: powermax
            type: powermax
            version: v1.18.2

            config:
              version: v1.18.2
              secret:
                encoded: false # if set to true, provide a base64 encoded value instead
                # Default secret names:
                # PowerFlex:  vxflexos-config
                # PowerMax:   powermax-creds
                # PowerStore: powerstore-config
                # PowerScale: isilon-creds
                name: powermax-creds
                value: |
                  storageArrays:
                    - storageArrayId: "000000000001"
                      primaryEndpoint: https://primary-1.unisphe.re:8443
                      backupEndpoint: https://backup-1.unisphe.re:8443
                  managementServers:
                    - endpoint: https://primary-1.unisphe.re:8443
                      username: admin
                      password: password
                      skipCertificateValidation: true
                    - endpoint: https://backup-1.unisphe.re:8443
                      username: admin2
                      password: password2
                      skipCertificateValidation: false
                      certSecret: primary-cert

              driver:
                csiDriverType: "powermax"
                csiDriverSpec:
                  # in OCP <= 4.16 and K8s <= 1.29, fsGroupPolicy is an immutable field
                  # fsGroupPolicy: Defines if the underlying volume supports changing ownership and permission of the volume before being mounted.
                  # Allowed values: ReadWriteOnceWithFSType, File , None
                  # Default value: ReadWriteOnceWithFSType
                  fSGroupPolicy: "ReadWriteOnceWithFSType"
                  # storageCapacity: Helps the scheduler to schedule the pod on a node satisfying the topology constraints, only if the requested capacity is available on the storage array
                  # Allowed values:
                  #   true: enable storage capacity tracking
                  #   false: disable storage capacity tracking
                  storageCapacity: true
                # replica: Define the number of PowerMax controller nodes
                # to deploy to the Kubernetes release
                # Controller count
                # Allowed values: n, where n > 0
                # Default value: 2
                replicas: 2
                # Default credential secret for Powermax, if not set it to ""
                authSecret: powermax-creds
                dnsPolicy: ClusterFirstWithHostNet
                forceRemoveDriver: true
                common:
                  # imagePullPolicy: Policy to determine if the image should be pulled prior to starting the container.
                  # Allowed values:
                  #  Always: Always pull the image.
                  #  IfNotPresent: Only pull the image if it does not already exist on the node.
                  #  Never: Never pull the image.
                  # Default value: None
                  imagePullPolicy: IfNotPresent
                  envs:
                    # X_CSI_MANAGED_ARRAYS: Serial ID of the arrays that will be used for provisioning
                    # Default value: None
                    # Examples: "000000000001,000000000002"
                    - name: X_CSI_MANAGED_ARRAYS
                      value: "000000000001,000000000002"
                    # X_CSI_POWERMAX_PORTGROUPS: Define the set of existing port groups that the driver will use.
                    # It is a comma separated list of portgroup names.
                    # Required only in case of iSCSI and NVMe/TCP only
                    # Allowed values: iSCSI or NVMe/TCP Port Group names
                    # Default value: None
                    # Examples: "pg1", "pg1, pg2"
                    - name: X_CSI_POWERMAX_PORTGROUPS
                      value: ""
                    # "X_CSI_TRANSPORT_PROTOCOL" can be "FC" or "FIBRE" for fibrechannel,
                    # "ISCSI" for iSCSI,
                    # "NVMETCP" for NVMeTCP or "" for autoselection.
                    # Allowed values:
                    #   "FC"    - Fiber Channel protocol
                    #   "FIBER" - Fiber Channel protocol
                    #   "ISCSI" - iSCSI protocol
                    #   "NVMETCP" = NVMeTCP protocol
                    #   ""      - Automatic selection of transport protocol
                    # Default value: "" <empty> defaults to auto if nothing is specified
                    - name: X_CSI_TRANSPORT_PROTOCOL
                      value: ""
                    # hostManagementMode: Controls how the driver manages host objects.
                    # "create" (default) creates new hosts; "adopt" discovers BFS hosts by WWPN.
                    - name: X_CSI_POWERMAX_HOST_MGMT_MODE
                      value: "create"
                    # Specifies who owns NVMe/TCP fabric sessions.
                    # Allowed values:
                    #   "driver" - the driver discovers targets and connects (default)
                    #   "host"   - the host owns the sessions; the driver uses the existing
                    #              ones and never creates, replaces or terminates a session
                    # Applies to every managed array; there is no per-array override.
                    # Default value: "driver"
                    - name: X_CSI_POWERMAX_NVMETCP_CONN_MODE
                      value: "driver"
                    # hostAdoptionMinOverlapRatio: Controls the minimum overlap ratio for host adoption validation.
                    # Allowed values: 0.0 to 1.0
                    #   - 0.5 (default) - Directional relaxation with >50% majority for larger HBA counts
                    #   - 0.75 - Stricter threshold for regulated environments
                    #   - 1.0 - Strict match (100% coverage required for all HBA counts)
                    # Note: For 2-WWPN systems, 100% coverage is always required regardless of this setting.
                    - name: X_CSI_POWERMAX_HOST_ADOPTION_MIN_OVERLAP_RATIO
                      value: "0.5"
                    # X_CSI_K8S_CLUSTER_PREFIX: Define a prefix that is appended onto
                    # all resources created in the Array
                    # This should be unique per K8s/CSI deployment
                    # maximum length of this value is 3 characters
                    # Default value: "CSM"
                    # Examples: "XYZ", "EMC"
                    - name: X_CSI_K8S_CLUSTER_PREFIX
                      value: "CSM"
                    # Specify kubelet config dir path.
                    # Ensure that the config.yaml file is present at this path.
                    # Default value: /var/lib/kubelet
                    - name: KUBELET_CONFIG_DIR
                      value: /var/lib/kubelet
                    # VMware/vSphere virtualization support
                    # set X_CSI_VSPHERE_ENABLED to true, if you to enable VMware virtualized environment support via RDM
                    # Allowed values:
                    #   "true" - vSphere volumes are enabled
                    #   "false" - vSphere volumes are disabled
                    # Default value: "false"
                    - name: "X_CSI_VSPHERE_ENABLED"
                      value: "false"
                    # X_CSI_VSPHERE_PORTGROUP: An existing portGroup that driver will use for vSphere
                    # recommended format: csi-x-VC-PG, x can be anything of user choice
                    # Allowed value: valid existing port group on the array
                    # Default value: "" <empty>
                    - name: "X_CSI_VSPHERE_PORTGROUP"
                      value: ""
                    # X_CSI_VSPHERE_HOSTNAME: An existing host(initiator group)/ host group(cascaded initiator group) that driver will use for vSphere
                    # this host should contain initiators from all the ESXs/ESXi host where the cluster is deployed
                    # recommended format: csi-x-VC-HN, x can be anything of user choice
                    # Allowed value: valid existing host/host group on the array
                    # Default value: "" <empty>
                    - name: "X_CSI_VSPHERE_HOSTNAME"
                      value: ""
                    # X_CSI_VCENTER_HOST: URL/endpoint of the vCenter where all the ESX are present
                    # Allowed value: valid vCenter host endpoint
                    # Default value: "" <empty>
                    - name: "X_CSI_VCENTER_HOST"
                      value: ""
                    # CSI driver log level
                    # Allowed values: "error", "warn"/"warning", "info", "debug"
                    # Default value: "info"
                    - name: "CSI_LOG_LEVEL"
                      value: "info"
                    # X_CSI_POWERMAX_SKIP_CERTIFICATE_VALIDATION: It determines if driver is going to skip verification
                    # of TLS certificates while connecting to Unisphere RESTAPI interface
                    # If it is set to false,
                    # then a secret powermax-certs has to be created with a X.509 certificate of CA
                    # which signed the Unisphere certificate
                    # Allowed values:
                    #   "true"  - TLS certificates verification will be skipped
                    #   "false" - TLS certificates will be verified
                    # Default value: "true"
                    - name: "X_CSI_POWERMAX_SKIP_CERTIFICATE_VALIDATION"
                      value: "true"
                    # CSI driver log format
                    # Allowed values: "text" or "json"
                    # Default value: "json"
                    - name: "CSI_LOG_FORMAT"
                      value: "json"
                    # X_CSI_POWERMAX_DEBUG: Enable/disable debug logs from gopowermax library.
                    - name: "X_CSI_POWERMAX_DEBUG"
                      value: "true"
                    # X_CSI_REVPROXY_USE_SECRET: Define whether or not to use the new secret format for the reverse proxy.
                    # Allowed values:
                    #   "true" - Use secret format for the reverse proxy
                    #   "false" - Use configmap format for the reverse proxy
                    # Default value: "false"
                    - name: "X_CSI_REVPROXY_USE_SECRET"
                      value: "false"
                    # X_CSI_DYNAMIC_SG_ENABLED: Enable/Disable dynamic Storage Group support for the driver
                    # When enabled, the driver supports multiple Storage Groups under a single StorageClass
                    # When disabled (default), the driver maintains backward compatibility and uses a single Storage Group
                    # Allowed values:
                    #   "true"  - Enable dynamic Storage Group support
                    #   "false" - Disable dynamic Storage Group support (backward compatible)
                    # Default value: "false"
                    - name: "X_CSI_DYNAMIC_SG_ENABLED"
                      value: "false"
                    # X_CSI_FS_CHECK_ENABLED: Enable/Disable file system check on volumes before mounting
                    # Allowed values:
                    #   "true"  - Enable file system check
                    #   "false" - Disable file system check
                    # Default value: "false"
                    - name: "X_CSI_FS_CHECK_ENABLED"
                      value: "false"
                    # X_CSI_FS_CHECK_MODE: Controls the file system check mode
                    # Allowed values:
                    #   "checkOnly"      - Check filesystem only, do not attempt repair
                    #   "checkAndRepair" - Check filesystem and attempt repair if errors found
                    # Default value: "checkOnly"
                    - name: "X_CSI_FS_CHECK_MODE"
                      value: "checkOnly"
                    # X_CSI_SPACE_RECLAMATION_ENABLED: Enable/Disable space reclamation
                    # Allowed values:
                    #    true: enable space reclamation.
                    #    false: disable space reclamation.
                    # Default value: false
                    - name: X_CSI_SPACE_RECLAMATION_ENABLED
                      value: "false"
                    # X_CSI_SPACE_RECLAMATION_SCHEDULE: Cron expression for reclamation schedule
                    - name: X_CSI_SPACE_RECLAMATION_SCHEDULE
                      value: "0 2 * * 0"
                    # X_CSI_SPACE_RECLAMATION_MAX_CONCURRENT: Max number of concurrent reclamation operations per node
                    - name: X_CSI_SPACE_RECLAMATION_MAX_CONCURRENT
                      value: "2"
                    # X_CSI_SPACE_RECLAMATION_TIMEOUT: TimeOut in Seconds
                    - name: X_CSI_SPACE_RECLAMATION_TIMEOUT
                      value: "14400"
                    # X_CSI_CSIADDONS_REPLICATION_ENABLED: Enable/Disable CSI Addons replication
                    # Allowed values:
                    #   "true"  - Enable CSI Addons replication
                    #   "false" - Disable CSI Addons replication
                    # Default value: "false"
                    - name: X_CSI_CSIADDONS_REPLICATION_ENABLED
                      value: "false"
                    # X_CSI_POWERMAX_METRO_SITE_FAILURE_HANDLING_ENABLED: Enable/Disable Metro site failure handling
                    # Allowed values:
                    #   "true"  - Enable Metro site failure handling
                    #   "false" - Disable Metro site failure handling
                    # Default value: "false"
                    - name: X_CSI_POWERMAX_METRO_SITE_FAILURE_HANDLING_ENABLED
                      value: "false"
                    # X_CSI_POWERMAX_METRO_STATE_CHECK_TIMEOUT: Timeout for Metro state check (per array)
                    # Allowed values: Go duration string (e.g., "15s")
                    # Default value: "15s"
                    - name: X_CSI_POWERMAX_METRO_STATE_CHECK_TIMEOUT
                      value: "15s"
                    # X_CSI_POWERMAX_METRO_QUEUE_WARNING_THRESHOLD: Warning threshold for deferred operation queue
                    # Allowed values: integer
                    # Default value: "100"
                    - name: X_CSI_POWERMAX_METRO_QUEUE_WARNING_THRESHOLD
                      value: "100"
                    # X_CSI_POWERMAX_METRO_QUEUE_HARD_LIMIT: Hard limit for deferred operation queue
                    # Allowed values: integer
                    # Default value: "500"
                    - name: X_CSI_POWERMAX_METRO_QUEUE_HARD_LIMIT
                      value: "500"
                    # X_CSI_POWERMAX_METRO_RECONCILIATION_BACKOFF: Backoff interval for reconciliation retry
                    # Allowed values: Go duration string (e.g., "30s")
                    # Default value: "30s"
                    - name: X_CSI_POWERMAX_METRO_RECONCILIATION_BACKOFF
                      value: "30s"
                    # X_CSI_DRIVER_INSTANCE_UID: Unique identifier for the driver instance (for CRD ownership isolation)
                    # Allowed values: string
                    # Default value: "" (empty)
                    - name: X_CSI_DRIVER_INSTANCE_UID
                      value: ""
                controller:
                  envs:
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from node plugin- volume usage, volume condition
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_CAPACITY_POLL_INTERVAL: Interval at which the background capacity poller
                    # refreshes per-array free-capacity utilization and health for multi-array zones.
                    # Accepts a Go duration string (e.g. "5m").
                    # Default value: "5m"
                    - name: X_CSI_CAPACITY_POLL_INTERVAL
                      value: "5m"
                    # X_CSI_CAPACITY_THRESHOLD_FULL: Capacity utilization percentage (0-100) at which
                    # an array is considered full for warning-event purposes. A warning event is emitted
                    # when utilization crosses (threshold - 10) percent.
                    # Default value: "100"
                    - name: X_CSI_CAPACITY_THRESHOLD_FULL
                      value: "100"
                  # nodeSelector: Define node selection constraints for controller pods.
                  # For the pod to be eligible to run on a node, the node must have each
                  # of the indicated key-value pairs as labels.
                  # Leave as blank to consider all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # tolerations: Define tolerations that would be applied to controller deployment
                  # Leave as blank to install controller on worker nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  tolerations:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  - key: "node-role.kubernetes.io/control-plane"
                  #    operator: "Exists"
                  #    effect: "NoSchedule"
                node:
                  envs:
                    # X_CSI_POWERMAX_ISCSI_ENABLE_CHAP: Determine if the driver is going to configure
                    # ISCSI node databases on the nodes with the CHAP credentials
                    # If enabled, the CHAP secret must be provided in the credentials secret
                    # and set to the key "chapsecret"
                    # Allowed values:
                    #   "true"  - CHAP is enabled
                    #   "false" - CHAP is disabled
                    # Default value: "false"
                    - name: X_CSI_POWERMAX_ISCSI_ENABLE_CHAP
                      value: "false"
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from node plugin- volume usage, volume condition
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_TOPOLOGY_CONTROL_ENABLED provides a way to filter topology keys on a node based on array and transport protocol
                    # if enabled, user can create custom topology keys by editing node-topology-config configmap.
                    # Allowed values:
                    #   true: enable the filtration based on config map
                    #   false: disable the filtration based on config map
                    # Default value: false
                    - name: X_CSI_TOPOLOGY_CONTROL_ENABLED
                      value: "false"
                    # X_CSI_MAX_VOLUMES_PER_NODE: Defines the maximum PowerMax volumes that the controller can schedule on the node
                    # Allowed values: Any value greater than or equal to 0
                    # Default value: "0"
                    - name: X_CSI_MAX_VOLUMES_PER_NODE
                      value: "0"
                  # nodeSelector: Define node selection constraints for node pods.
                  # For the pod to be eligible to run on a node, the node must have each
                  # of the indicated key-value pairs as labels.
                  # Leave as blank to consider all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # tolerations: Define tolerations that would be applied to node daemonset
                  # Add/Remove tolerations as per requirement
                  # Leave as blank if you wish to not apply any tolerations
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  tolerations:
                    - key: "node.kubernetes.io/memory-pressure"
                      operator: "Exists"
                      effect: "NoExecute"
                    - key: "node.kubernetes.io/disk-pressure"
                      operator: "Exists"
                      effect: "NoExecute"
                    - key: "node.kubernetes.io/network-unavailable"
                      operator: "Exists"
                      effect: "NoExecute"
                # Uncomment and tab if nodes you wish to use have the node-role.kubernetes.io/master taint
                # - key: "node-role.kubernetes.io/master"
                #   operator: "Exists"
                #   effect: "NoSchedule"
                # Uncomment and tab if CSM for Resiliency and CSI Driver pods monitor is enabled
                #  - key: "offline.powermax.storage.dell.com"
                #    operator: "Exists"
                #    effect: "NoSchedule"
                #  - key: "powermax.podmon.storage.dell.com"
                #    operator: "Exists"
                #    effect: "NoSchedule"
                sideCars:
                  # 'csivol' represents a string prepended to each volume created by the CSI driver
                  - name: provisioner
                    args: ["--volume-name-prefix=csivol"]
                  # health monitor is disabled by default, refer to driver documentation before enabling it
                  # Default monitor-interval: 60s
                  - name: external-health-monitor
                    enabled: false
                    args: ["--monitor-interval=60s"]
                  - name: snapshotter
                    args: ["--feature-gates=CSIVolumeGroupSnapshot=false"]
                    # Uncomment the following to configure how often external-provisioner polls the driver to detect changed capacity
                    # Configure only when the storageCapacity is set as "true"
                    # Allowed values: 1m,2m,3m,...,10m,...,60m etc. Default value: 5m
                    # - name: provisioner
                    #  args: ["--capacity-poll-interval=5m"]
                # metrics: Configures the built-in Prometheus metrics endpoint on the driver.
                metrics:
                  # enabled: Set to true to expose the metrics endpoint on the driver pods.
                  # Default value: false
                  enabled: false
                  # port: Port on which the metrics endpoint is exposed. Default for PowerMax: 8443.
                  port: 8443
                  # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
                  # When set the operator mounts the secret and configures HTTPS automatically.
                  # Leave unset to serve metrics over plain HTTP.
                  tlsCertSecret: ""
                  # collection: Controls metrics collection cadence and cache behavior inside the driver.
                  collection:
                    # interval: How often metrics are collected from PowerMax arrays.
                    # Default value: 30s
                    interval: 30s
                    # cacheTTL: How long collected metric responses are cached.
                    # Default value: 25s
                    cacheTTL: 25s
                  # array: Controls array-facing metrics collection request behavior.
                  array:
                    # rateLimit: Max allowed PowerMax API requests per second during metrics collection.
                    # Default value: 100
                    rateLimit: 100
                    # timeout: Per-request timeout for PowerMax API calls made during metrics collection.
                    # Default value: 30s
                    timeout: 30s
                    circuitBreaker:
                      # threshold: Number of consecutive failures before the circuit opens.
                      # Default value: 3
                      threshold: 3
                      # resetTimeout: How long the circuit stays open before allowing a test request (half-open).
                      # Default value: 30s
                      resetTimeout: 30s
                  # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
                  serviceMonitor:
                    enabled: false
                    interval: 30s
                    scrapeTimeout: 10s
                    insecureSkipVerify: false
                  # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
                  podMonitor:
                    enabled: false
                    interval: 30s
                    scrapeTimeout: 10s
                    insecureSkipVerify: false
                  prometheusRule:
                    # enabled: When true, creates a PrometheusRule CR with 15 PowerMax CSI driver alert rules.
                    # Requires Prometheus Operator CRDs to be installed.
                    enabled: false
                    # volumeOperationFailureThreshold: Failures in 5m window to trigger PM-01 to PM-08 alerts.
                    volumeOperationFailureThreshold: 3
                    # cpuWarningThreshold: Integer percent CPU threshold for PM-10. Default: 80
                    cpuWarningThreshold: 80
                    # memoryWarningThreshold: Memory threshold in bytes for PM-11. Default: 2147483648 (2 GiB)
                    memoryWarningThreshold: 2147483648
                    # apiErrorRateThreshold: Integer percent API error rate for PM-12. Default: 10
                    apiErrorRateThreshold: 10
                    # apiErrorRateWindow: Time window for PM-12 API error rate. Default: "5m"
                    apiErrorRateWindow: "5m"
                    # storageGroupCapacityWarning: Integer percent SG utilization warning for PM-13. Default: 80
                    storageGroupCapacityWarning: 80
                    # storageGroupCapacityCritical: Integer percent SG utilization critical for PM-14. Default: 90
                    storageGroupCapacityCritical: 90
                    # srpSnapshotCapacityWarning: Integer percent SRP snapshot capacity warning for PM-15. Default: 80
                    srpSnapshotCapacityWarning: 80
              modules:
                # CSI Powermax Reverseproxy is a mandatory module for Powermax
                - name: csireverseproxy
                  components:
                    - name: csipowermax-reverseproxy
                      envs:
                        # "tlsSecret" defines the TLS secret that is created with certificate
                        # and its associated key
                        # Default value: None
                        # Example: "tls-secret"
                        - name: X_CSI_REVPROXY_TLS_SECRET
                          value: "csirevproxy-tls-secret"
                        - name: X_CSI_REVPROXY_PORT
                          value: "2222"
                        - name: X_CSI_CONFIG_MAP_NAME
                          value: "powermax-reverseproxy-config"
                        # deployAsSidecar defines the way reversproxy is installed with the driver
                        # set it true, if csm-auth is enabled / you want it as a sidecar container
                        # set it false, if you want it as a deployment
                        - name: "DeployAsSidecar"
                          value: "true"
                # Authorization: enable csm-authorization for RBAC
                - name: authorization
                  # enabled: Enable/Disable csm-authorization
                  # Default value: false
                  enabled: false
                  components:
                    - name: karavi-authorization-proxy
                      envs:
                        # proxyHost: hostname of the csm-authorization server
                        # Default value: none
                        - name: "PROXY_HOST"
                          value: "csm-authorization.com"
                        # skipCertificateValidation: Enable/Disable certificate validation of the csm-authorization server
                        # Default value: "true"
                        - name: "SKIP_CERTIFICATE_VALIDATION"
                          value: "true"
                # Replication: allows configuring replication module
                # Replication CRDs must be installed before installing driver
                - name: replication
                  # enabled: Enable/Disable replication feature
                  # Allowed values:
                  #   true: enable replication feature(install dell-csi-replicator sidecar)
                  #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                  # Default value: false
                  enabled: false
                  metrics:
                    # enabled: Enable/Disable replication metrics endpoint on the dell-csi-replicator sidecar
                    # Default value: false
                    enabled: false
                    # port: Port for the replication metrics endpoint
                    # Default value: 8445
                    port: 8445
                    # tlsCertSecret: Name of the TLS secret for replication metrics. Leave empty to disable TLS.
                    # Default value: ""
                    tlsCertSecret: ""
                    collection:
                      # interval: How frequently replication metrics are collected
                      # Default value: "30s"
                      interval: "30s"
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor for Prometheus Operator
                      # Default value: false
                      enabled: false
                      # interval: Scrape interval for the ServiceMonitor
                      # Default value: "30s"
                      interval: "30s"
                      # scrapeTimeout: Scrape timeout for the ServiceMonitor
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification for ServiceMonitor
                      # Default value: false
                      insecureSkipVerify: false
                    prometheusRule:
                      enabled: true
                      # rpoThresholdSeconds: Replication lag threshold in seconds for REP-01 and REP-02 alerts.
                      # Default: 300 (5 minutes).
                      rpoThresholdSeconds: 300
                      # srdfMinBandwidth: Minimum acceptable SRDF bandwidth in bytes/sec for REP-07 alert.
                      # Default: 10485760 (10 MB/s).
                      srdfMinBandwidth: 10485760
                      # srdfLagSeconds: SRDF replication lag threshold in seconds for REP-12 alert.
                      # Default: 300 (5 minutes).
                      srdfLagSeconds: 300
                  components:
                    - name: dell-csi-replicator
                      envs:
                        # replicationPrefix: prefix to prepend to storage classes parameters
                        # Allowed values: string
                        # Default value: replication.storage.dell.com
                        - name: "X_CSI_REPLICATION_PREFIX"
                          value: "replication.storage.dell.com"
                        # replicationContextPrefix: prefix to use for naming of resources created by replication feature
                        # Allowed values: string
                        # Default value: powermax
                        - name: "X_CSI_REPLICATION_CONTEXT_PREFIX"
                          value: "powermax"
                    - name: dell-replication-controller-manager
                      envs:
                        # Replication log level
                        # Allowed values: "error", "warn"/"warning", "info", "debug"
                        # Default value: "info"
                        - name: "REPLICATION_CTRL_LOG_LEVEL"
                          value: "info"
                        # Replication log format
                        # Allowed values: "text", "json"
                        # Default value: "json"
                        - name: "REPLICATION_CTRL_LOG_FORMAT"
                          value: "json"
                        # replicas: Defines number of controller replicas
                        # Allowed values: int
                        # Default value: 1
                        - name: "REPLICATION_CTRL_REPLICAS"
                          value: "1"
                        # retryIntervalMin: Initial retry interval of failed reconcile request.
                        # It doubles with each failure, upto retry-interval-max
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MIN"
                          value: "1s"
                        # RETRY_INTERVAL_MAX: Maximum retry interval of failed reconcile request
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MAX"
                          value: "5m"
                        # DISABLE_PVC_REMAP: Disable PVC remapping for replication in single cluster configuration
                        # Allowed values:
                        #   true: Disable replication feature(install dell-csi-replicator sidecar)
                        #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                        # Default value: false
                        - name: "DISABLE_PVC_REMAP"
                          value: "false"
                        # REPLICATION_ALLOW_PVC_CREATION_ON_TARGET: It Creates PVC on target cluster using replicated PV.
                        # Allowed values:
                        #   true: It creates a PVC on target cluster against replicated PV
                        #   false: simply updates claimref on replicated PV on target cluster without actually creating a PVC
                        # Default value: false
                        - name: "REPLICATION_ALLOW_PVC_CREATION_ON_TARGET"
                          value: "false"
                # observability: allows to configure observability
                - name: observability
                  # enabled: Enable/Disable observability
                  # Default value: false
                  enabled: false
                  components:
                    - name: otel-collector
                      # enabled: Enable/Disable OpenTelemetry Collector
                      # Default value: false
                      enabled: false
                      # certificate: base64-encoded certificate for cert/private-key pair -- add cert here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      certificate: ""
                      # privateKey: base64-encoded private key for cert/private-key pair -- add private key here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      privateKey: ""
                    - name: cert-manager
                      # enabled: Enable/Disable cert-manager
                      # Allowed values:
                      #   true: enable deployment of cert-manager
                      #   false: disable deployment of cert-manager only if it's already deployed
                      # Default value: false
                      enabled: false
                    - name: metrics-powermax
                      # enabled: Enable/Disable PowerMax metrics
                      # Default value: false
                      enabled: false
                      envs:
                        # POWERMAX_MAX_CONCURRENT_QUERIES: set the default max concurrent queries to PowerMax
                        # Allowed values: int
                        # Default value: 10
                        - name: "POWERMAX_MAX_CONCURRENT_QUERIES"
                          value: "10"
                        # POWERMAX_CAPACITY_METRICS_ENABLED: enable/disable collection of capacity metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERMAX_CAPACITY_METRICS_ENABLED"
                          value: "true"
                        # POWERMAX_PERFORMANCE_METRICS_ENABLED: enable/disable collection of volume performance metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERMAX_PERFORMANCE_METRICS_ENABLED"
                          value: "true"
                        # POWERMAX_TOPOLOGY_METRICS_ENABLED: enable/disable collection of topology metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERMAX_TOPOLOGY_METRICS_ENABLED"
                          value: "true"
                        # POWERMAX_TOPOLOGY_METRICS_POLL_FREQUENCY: set polling frequency to get topology metrics
                        # Allowed values: int
                        # Default value: 300
                        - name: "POWERMAX_TOPOLOGY_METRICS_POLL_FREQUENCY"
                          value: "300"
                        # POWERMAX_CAPACITY_POLL_FREQUENCY: set polling frequency to get capacity metrics data
                        # Allowed values: int
                        # Default value: 3600
                        - name: "POWERMAX_CAPACITY_POLL_FREQUENCY"
                          value: "3600"
                        # POWERMAX_PERFORMANCE_POLL_FREQUENCY: set polling frequency to get volume performance data
                        # Allowed values: int
                        # Default value: 300
                        - name: "POWERMAX_PERFORMANCE_POLL_FREQUENCY"
                          value: "300"
                        # PowerMax metrics log level
                        # Valid values: trace, debug, info, warn, error, fatal, panic
                        # Default value: "info"
                        - name: "POWERMAX_LOG_LEVEL"
                          value: "info"
                        # PowerMax Metrics Output logs in the specified format
                        # Valid values: text, json
                        # Default value: "json"
                        - name: "POWERMAX_LOG_FORMAT"
                          value: "json"
                        # otel collector address
                        # Allowed values: String
                        # Default value: "otel-collector:55680"
                        - name: "COLLECTOR_ADDRESS"
                          value: "otel-collector:55680"
                        # configMap name which has all array/endpoint related info
                        - name: "X_CSI_CONFIG_MAP_NAME"
                          value: "powermax-reverseproxy-config"
                  # metrics: Configure the observability self-metrics endpoint on the karavi-metrics-powermax
                  metrics:
                    # enabled: Enable/Disable observability self-metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by observability self-metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8443
                    port: 8443
                    # tlsCertSecret: Name of secret containing TLS certificate and key for observability self-metrics
                    # Allowed values: Kubernetes secret name, empty string
                    # Default value: ""
                    tlsCertSecret: ""
                    # serviceMonitor: Configure ServiceMonitor for observability self-metrics
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor creation for observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Prometheus scrape interval for observability self-metrics
                      # Allowed values: duration string (for example: 15s, 30s, 1m)
                      # Default value: "30s"
                      interval: "30s"
                      # scrapeTimeout: Prometheus scrape timeout for observability self-metrics
                      # Allowed values: duration string, empty string
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS certificate verification while scraping observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Configure Prometheus Operator PrometheusRule for observability alerts
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for observability alerts
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                - name: resiliency
                  # enabled: Enable/Disable Resiliency feature
                  # Allowed values:
                  #   true: enable Resiliency feature(deploy podmon sidecar)
                  #   false: disable Resiliency feature(do not deploy podmon sidecar)
                  # Default value: false
                  enabled: false
                  components:
                    - name: podmon-controller
                      imagePullPolicy: IfNotPresent
                      args:
                        - "--labelvalue=csi-powermax"
                        - "--arrayConnectivityPollRate=60"
                        - "--skipArrayConnectionValidation=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        - "--arrayConnectivityConnectionLossThreshold=3"
                        # Below 4 args should not be modified.
                        - "--csisock=unix:/var/run/csi/csi.sock"
                        - "--mode=controller"
                        - "--driver-config-params=/powermax-config-params/driver-config-params.yaml"
                        - "--driverPath=csi-powermax.dellemc.com"
                    - name: podmon-node
                      imagePullPolicy: IfNotPresent
                      envs:
                        # podmonAPIPort: Defines the port to be used within the kubernetes cluster
                        # Allowed values: Any valid and free port (string)
                        # Default value: 8083
                        - name: "X_CSI_PODMON_API_PORT"
                          value: "8083"
                          # podmonAPIToken: Shared secret token for authenticating podmon API requests
                          # Security note: podmon API uses HTTP; use this only on trusted cluster-internal networks.
                          # Example (literal value):
                          # - name: "X_CSI_PODMON_API_TOKEN"
                          #   value: "<strong-random-token>"
                          # Note: valueFrom.secretKeyRef is not currently supported for this token
                      args:
                        - "--labelvalue=csi-powermax"
                        - "--arrayConnectivityPollRate=60"
                        - "--leaderelection=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        # Below 4 args should not be modified.
                        - "--csisock=unix:/var/lib/kubelet/plugins/powermax.emc.dell.com/csi_sock"
                        - "--mode=node"
                        - "--driver-config-params=/powermax-config-params/driver-config-params.yaml"
                        - "--driverPath=csi-powermax.dellemc.com"
                  # metrics: Configure resiliency module metrics endpoint
                  # The operator automatically creates Service/ServiceMonitor/PodMonitor resources for podmon metrics.
                  metrics:
                    # enabled: Enable/Disable resiliency module metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by resiliency module metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8444
                    port: 8444
                    # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
                    # When set the operator mounts the secret and configures HTTPS automatically.
                    # Leave unset to serve metrics over plain HTTP.
                    tlsCertSecret: ""
                    # collection: Controls metrics collection cadence inside the resiliency module.
                    collection:
                      # interval: Interval at which metrics are collected
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                    # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
                    podMonitor:
                      # enabled: Enable/Disable PodMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Creates a Prometheus Operator PrometheusRule containing resiliency alert rules.
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for resiliency alerts
                      # Allowed values: true, false
                      # Default value: true
                      enabled: true
                      # connectivitySuccessRatio: Minimum percentage of successful array connectivity checks
                      # below which the CSMResiliencyConnectivityLost alert fires.
                      # Allowed values: 0-100
                      # Default value: 90
                      connectivitySuccessRatio: 90

          storageclass:
            name: powermax
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            provisioner: csi-powermax.dellemc.com
            # reclaimPolicy: PVs that are dynamically created by a StorageClass will have the reclaim policy specified here
            # Allowed values:
            #   Reclaim: retain the PV after PVC deletion
            #   Delete: delete the PV after PVC deletion
            # Optional: true
            # Default value: Delete
            reclaimPolicy: Delete
            # allowVolumeExpansion: allows the users to resize the volume by editing the corresponding PVC object
            # Allowed values:
            #   true: allow users to resize the PVC
            #   false: does not allow users to resize the PVC
            # Optional: true
            # Default value: false
            allowVolumeExpansion: true
            parameters:
              # "csi.storage.k8s.io/fstype" is used to set the filesystem type which will be used to format the new volume
              # Allowed values:
              #   "ext4" - EXT4 File system
              #   "xfs"  - XFS File system
              # Optional: true
              # Default value: None if defaultFsType is not mentioned in values.yaml
              # Else defaultFsType value mentioned in values.yaml
              # will be used as default value
              csi.storage.k8s.io/fstype: ext4
              # Name of SRP on the PowerMax array that should be used for provisioning
              # Optional: false
              # Examples: "DEFAULT_SRP" , "SRP_1"
              SRP: SRP_1
              # Serial ID of the array that is used for provisioning
              # Optional: false
              # Example: "000000000001"
              SYMID: "000000000001"
              # Name of Service Level on PowerMax array that should be used for provisioning
              # Optional: true, Default value: Optimized
              # Examples: "Diamond" , "Bronze"
              #ServiceLevel: Diamond
              # Name of application to be used to group volumes
              # This is used in naming storage group
              # Optional: true, Default value: None
              # Examples: APP, app, sanity, tests
              #ApplicationPrefix: app
              # Following params are for HostLimits, set them only if you want to set IOLimits
              # HostLimitName uniquely identifies given set of limits on a storage class
              # This is used in naming storage group, max of 3 letter
              # Optional: true
              # Example: "HL1", "HL2"
              #HostLimitName: "HL1"
              # The MBs per Second Host IO limit for the storage class
              # Optional: true, Default: ""
              # Examples: 100, 200, NOLIMIT
              #HostIOLimitMBSec: ""
              # The IOs per Second Host IO limit for the storage class
              # Optional: true, Default: ""
              # Examples: 100, 200, NOLIMIT
              #HostIOLimitIOSec: ""
              # distribution of the Host IO limits for the storage class
              # Optional: true, Default: ""
              # Allowed values: Never","Always" or "OnFailure" only
              #DynamicDistribution: ""
            # volumeBindingMode determines how volume binding and dynamic provisioning should occur
            # Allowed values: 
            #  Immediate: volume binding and dynamic provisioning occurs once PVC is created
            #  WaitForFirstConsumer: delay the binding and provisioning of PV until a pod using the PVC is created.
            #  Optional: false
            # Default value: WaitForFirstConsumer (required for topology section below) 
            volumeBindingMode: WaitForFirstConsumer
            # allowedTopologies helps scheduling pods on worker nodes which match all of below expressions.
            #allowedTopologies:
            #- matchLabelExpressions:
            #  - key: csi-powermax.dellemc.com/SYM_ID # replace SYM_ID with Serial ID of the array
            #    values:
            #      - csi-powermax.dellemc.com
            #  - key: csi-powermax.dellemc.com/SYM_ID.fc # replace SYM_ID with Serial ID of the array
            #    values:
            #      - csi-powermax.dellemc.com

  - name: "powerstore-v2180"
    displayName: "PowerStore v2.18.1"
    group: "Platform"
    remove:
    - "charts.csm-operator.csm"
    - "charts.csm-operator.reverseProxyConfig"
    - "charts.csm-operator.storageclass"
    - "charts.csm-operator.snapshot-controller"
    add: |
      charts:
        csm-operator:
          image:
            repository: quay.io/dell/container-storage-modules/dell-csm-operator
            pullPolicy: IfNotPresent
            tag: "v1.13.2"

          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi

          csm:
            # Select a preset to populate the default configuration for your platform
            namespace: powerstore

            type: powerstore
            version: v1.18.2

            config:
              version: v1.18.2
              secret:
                encoded: false # if set to true, provide a base64 encoded value instead
                # Default secret names:
                # PowerFlex:  vxflexos-config
                # PowerMax:   powermax-creds
                # PowerStore: powerstore-config
                # PowerScale: isilon-creds
                name: powerstore-config
                value: |
                  arrays:
                    - endpoint: "https://10.0.0.1/api/rest"     # full URL path to the PowerStore API
                      globalID: "unique"                        # unique id of the PowerStore array
                      username: "user"                          # username for connecting to API
                      password: "password"                      # password for connecting to API
                      skipCertificateValidation: true           # indicates if client side validation of (management)server's certificate can be skipped
                      isDefault: true                           # treat current array as a default (would be used by storage classes without arrayID parameter)
                      blockProtocol: "auto"                     # what SCSI transport protocol use on node side (FC, ISCSI, NVMeTCP, NVMeFC, None, or auto)
                      nasName: "nas-server"                     # what NAS should be used for NFS volumes
                      nfsAcls: "0777"                           # (Optional) defines permissions - POSIX mode bits or NFSv4 ACLs, to be set on NFS target mount directory.
                                                                # NFSv4 ACls are supported for NFSv4 shares on NFSv4 enabled NAS servers only. POSIX ACLs are not supported and only POSIX mode bits are supported for NFSv3 shares.
                # Example value for encoded
                # value: LSB1c2VybmFtZTogImFkbWluIgogIHBhc3N3b3JkOiAiUGFzc3dvcmQxMjMiCiAgc3lzdGVtSUQ6ICIyYjExYmIxM...

              driver:
                csiDriverType: "powerstore"
                csiDriverSpec:
                  # in OCP <= 4.16 and K8s <= 1.29, fsGroupPolicy is an immutable field
                  # fsGroupPolicy: Defines if the underlying volume supports changing ownership and permission of the volume before being mounted.
                  # Allowed values: ReadWriteOnceWithFSType, File , None
                  # Default value: ReadWriteOnceWithFSType
                  fSGroupPolicy: "ReadWriteOnceWithFSType"
                  # storageCapacity: Helps the scheduler to schedule the pod on a node satisfying the topology constraints, only if the requested capacity is available on the storage array
                  # Allowed values:
                  #   true: enable storage capacity tracking
                  #   false: disable storage capacity tracking
                  storageCapacity: true
                # authSecret: This is the secret used to validate the default PowerStore secret used for installation
                # Allowed values: <metadataName specified in the Manifest>-config
                # For example: If the metadataName is set to powerstore, authSecret value should be set to powerstore-config
                authSecret: powerstore-config
                # IPv6 Endpoint Configuration:
                # When configuring PowerStore array endpoints in the secret, IPv6 addresses must be bracketed.
                # IPv4 examples: https://10.0.0.1/api/rest, https://my-array.example.com/api/rest
                # IPv6 examples: https://[2001:db8::1]/api/rest, https://[2001:db8::1]:443/api/rest
                # Portless IPv6 endpoints will default to port 443 (e.g., https://[2001:db8::1] defaults to https://[2001:db8::1]:443)
                # Controller count
                # Allowed values: n, where n > 0
                # Default value: 2
                replicas: 2
                dnsPolicy: ClusterFirstWithHostNet
                forceRemoveDriver: true
                common:
                  imagePullPolicy: IfNotPresent
                  envs:
                    - name: X_CSI_POWERSTORE_NODE_NAME_PREFIX
                      value: "csi-node"
                    - name: X_CSI_FC_PORTS_FILTER_FILE_PATH
                      value: "/etc/fc-ports-filter"
                    # Specify kubelet config dir path.
                    # Ensure that the config.yaml file is present at this path.
                    # Default value: /var/lib/kubelet
                    - name: KUBELET_CONFIG_DIR
                      value: /var/lib/kubelet
                    - name: CSI_LOG_LEVEL
                      value: info
                    # CSI driver log format
                    # Allowed values: "text" or "json"
                    # Default value: "json"
                    - name: CSI_LOG_FORMAT
                      value: json
                    # GOPOWERSTORE_DEBUG: Enable/disable debug logs from gopowerstore library.
                    # Default value: false
                    - name: "GOPOWERSTORE_DEBUG"
                      value: "false"
                    # CERT_SECRET_COUNT: Represents number of certificate secrets, which user is going to create for
                    # ssl authentication. (powerstore-cert-0..powerstore-cert-n)
                    # This field is only verified if X_CSI_POWERSTORE_SKIP_CERTIFICATE_VALIDATION is set to false
                    # Allowed values: n, where n > 0
                    # Default value: None
                    - name: CERT_SECRET_COUNT
                      value: "1"
                    # X_CSI_POWERSTORE_SKIP_CERTIFICATE_VALIDATION: Specifies if the driver is going to validate certs.
                    # If it is set to false, then a secret powerstore-certs has to be created with an X.509 certificate of CA which signed the certificate.
                    # Allowed values:
                    #   true: skip certificate verification
                    #   false: verify certificates
                    # Default value: true
                    - name: X_CSI_POWERSTORE_SKIP_CERTIFICATE_VALIDATION
                      value: "true"
                    # X_CSI_POWERSTORE_API_TIMEOUT: Defines the timeout for PowerStore REST API calls.
                    # Allowed values: Number followed by unit (s,m,h)
                    # Examples: 10s, 1m, 1h
                    # Default value: 120s
                    - name: X_CSI_POWERSTORE_API_TIMEOUT
                      value: "120s"
                    # X_CSI_PODMON_ARRAY_CONNECTIVITY_TIMEOUT: Defines the timeout (in seconds) for podmon array connectivity timeout check
                    # Allowed values: Number followed by unit (s,m,h)
                    # Examples: 10s, 1m, 1h
                    # Default value: 10s
                    - name: "X_CSI_PODMON_ARRAY_CONNECTIVITY_TIMEOUT"
                      value: "10s"
                    # X_CSM_DR_ENABLED: Enable/Disable CSM Disaster Recovery.
                    # Allowed values:
                    #   true: enable CSM Disaster Recovery
                    #   false: disable CSM Disaster Recovery
                    # Default value: true
                    - name: "X_CSM_DR_ENABLED"
                      value: "true"
                    # X_CSM_DR_BIND_PORT: Bind port for CSM-DR controller initialization.
                    # Allowed values: valid port number (e.g., "8082")
                    # Default value: "8082"
                    - name: "X_CSM_DR_BIND_PORT"
                      value: "8082"
                    # X_CSI_ALERT_MONITOR_ENABLED: Enable/Disable the alert monitor service that polls PowerStore for volume alerts.
                    # When enabled, the monitor service queries PowerStore for alerts and records them as Kubernetes events on PersistentVolumes.
                    # Allowed values:
                    #   true: enable alert monitor service
                    #   false: disable alert monitor service
                    # Default value: true
                    - name: X_CSI_ALERT_MONITOR_ENABLED
                      value: "true"
                    # X_CSI_ALERT_MONITOR_POLL_INTERVAL: Defines the polling interval for the alert monitor service.
                    # Allowed values: Number followed by unit (s,m,h)
                    # Examples: 30s, 1m, 5m
                    # Default value: 5m
                    - name: X_CSI_ALERT_MONITOR_POLL_INTERVAL
                      value: "5m"
                    # X_CSI_FS_CHECK_ENABLED: Enable/Disable automatic file system check before mount.
                    # Allowed values:
                    #   true: enable file system check
                    #   false: disable file system check
                    # Default value: false
                    - name: X_CSI_FS_CHECK_ENABLED
                      value: "false"
                    # X_CSI_FS_CHECK_MODE: Controls the file system check mode.
                    # Allowed values: "checkOnly", "checkAndRepair"
                    # Default value: "checkOnly"
                    - name: X_CSI_FS_CHECK_MODE
                      value: "checkOnly"
                    # X_CSI_SPACE_RECLAMATION_ENABLED: Enable/Disable space reclamation
                    # Allowed values:
                    #    true: enable space reclamation.
                    #    false: disable space reclamation.
                    # Default value: false
                    - name: X_CSI_SPACE_RECLAMATION_ENABLED
                      value: "false"
                    # X_CSI_SPACE_RECLAMATION_SCHEDULE: Cron expression for reclamation schedule
                    - name: X_CSI_SPACE_RECLAMATION_SCHEDULE
                      value: "0 2 * * 0"
                    # X_CSI_SPACE_RECLAMATION_MAX_CONCURRENT: Max number of concurrent reclamation operations per node
                    - name: X_CSI_SPACE_RECLAMATION_MAX_CONCURRENT
                      value: "2"
                    # X_CSI_SPACE_RECLAMATION_TIMEOUT: TimeOut in Seconds
                    - name: X_CSI_SPACE_RECLAMATION_TIMEOUT
                      value: "14400"
                    # X_CSI_CSIADDONS_REPLICATION_ENABLED: Enable/Disable CSI Addons replication
                    # Allowed values:
                    #   "true"  - Enable CSI Addons replication
                    #   "false" - Disable CSI Addons replication
                    # Default value: "false"
                    - name: X_CSI_CSIADDONS_REPLICATION_ENABLED
                      value: "false"
                sideCars:
                  # 'csivol' represents a string prepended to each volume created by the CSI driver
                  - name: provisioner
                    args: ["--volume-name-prefix=csivol"]
                  # health monitor is disabled by default, refer to driver documentation before enabling it
                  - name: external-health-monitor
                    enabled: false
                    args:
                      - "--monitor-interval=60s"
                      - "--http-endpoint=:8080"
                  - name: snapshotter
                    args: ["--feature-gates=CSIVolumeGroupSnapshot=false"]
                # metrics: Configure driver metrics endpoint
                # The operator automatically wires the TLS secret and creates Service/ServiceMonitor/PodMonitor resources.
                metrics:
                  # enabled: Enable/Disable driver metrics endpoint
                  # Allowed values: true, false
                  # Default value: false
                  enabled: false
                  # port: Port used by driver metrics endpoint
                  # Allowed values: 1-65535
                  # Default value: 8443
                  port: 8443
                  # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
                  # When set the operator mounts the secret and configures HTTPS automatically.
                  # Leave unset to serve metrics over plain HTTP.
                  tlsCertSecret: ""
                  # leaderElection: Configure leader election for array-level metrics collection.
                  # Only the leader controller will collect array-level metrics to avoid duplicate API calls.
                  leaderElection:
                    # enabled: Enable leader election for array-level metrics collection
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # leaseDuration: Duration that non-leader candidates will wait to acquire the lease
                    # Allowed values: Go duration string (e.g., 60s, 1m)
                    # Default value: 60s
                    leaseDuration: 60s
                    # renewDeadline: Duration that the acting leader will retry refreshing leadership before giving up
                    # Allowed values: Go duration string (e.g., 40s, 1m)
                    # Default value: 40s
                    renewDeadline: 40s
                    # retryPeriod: Duration the LeaderElector clients should wait between tries of actions
                    # Allowed values: Go duration string (e.g., 5s, 10s)
                    # Default value: 5s
                    retryPeriod: 5s
                  # collection: Controls metrics collection cadence and cache behavior inside the driver.
                  # cacheTTL must be greater than array.circuitBreaker.resetTimeout to prevent serving empty data.
                  collection:
                    # interval: How frequently metrics are collected from the array
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    interval: 30s
                    # cacheTTL: How long collected metric responses are cached
                    # Allowed values: Go duration string (e.g., 25s, 1m)
                    # Default value: 25s
                    cacheTTL: 25s
                  # array: Controls array-facing metrics collection request behavior.
                  array:
                    # rateLimit: Max allowed PowerStore API requests per second during metrics collection
                    # Allowed values: Positive integer
                    # Default value: 100
                    rateLimit: 100
                    # timeout: Per-request timeout for PowerStore API calls made during metrics collection
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    timeout: 30s
                    circuitBreaker:
                      # threshold: Number of consecutive failures before the circuit opens
                      # Allowed values: Positive integer
                      # Default value: 3
                      threshold: 3
                      # resetTimeout: How long the circuit stays open before allowing a test request (half-open)
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      resetTimeout: 30s
                  # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
                  serviceMonitor:
                    # enabled: Enable/Disable ServiceMonitor for driver metrics
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # interval: Interval at which metrics should be scraped
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    interval: 30s
                    # scrapeTimeout: Timeout after which the scrape is ended
                    # Allowed values: Go duration string (e.g., 10s)
                    # Default value: ""
                    scrapeTimeout: ""
                    # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    insecureSkipVerify: false
                  # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
                  podMonitor:
                    # enabled: Enable/Disable PodMonitor for driver metrics
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # interval: Interval at which metrics should be scraped
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    interval: 30s
                    # scrapeTimeout: Timeout after which the scrape is ended
                    # Allowed values: Go duration string (e.g., 10s)
                    # Default value: ""
                    scrapeTimeout: ""
                    # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    insecureSkipVerify: false
                  # prometheusRule: Creates a Prometheus Operator PrometheusRule with alert rules for driver metrics.
                  prometheusRule:
                    # enabled: Enable/Disable PrometheusRule for driver alerts
                    # Allowed values: true, false
                    # Default value: true (auto-deploys alert rules when metrics is enabled)
                    enabled: true
                    # applianceWarningThreshold: Whole-percent appliance utilization threshold that triggers a warning alert
                    # Allowed values: 0-100
                    # Default value: 80
                    applianceWarningThreshold: 80
                    # applianceCriticalThreshold: Whole-percent appliance utilization threshold that triggers a critical alert
                    # Allowed values: 0-100
                    # Default value: 90
                    applianceCriticalThreshold: 90
                    # apiErrorRateThreshold: Whole-percent API error threshold that triggers an alert
                    # Allowed values: 0-100
                    # Default value: 10
                    apiErrorRateThreshold: 10
                    # apiErrorRateWindow: Lookback window used when evaluating the API error ratio alert expression
                    # Allowed values: Go duration string (e.g., 5m, 10m)
                    # Default value: 5m
                    apiErrorRateWindow: 5m
                    # cpuWarningThreshold: Whole-percent CPU utilization threshold that triggers a warning alert for driver pods
                    # Allowed values: 0-100
                    # Default value: 80
                    cpuWarningThreshold: 80
                    # memoryWarningThreshold: Memory usage threshold in bytes that triggers a warning alert for driver pods
                    # Allowed values: Positive integer (bytes)
                    # Default value: 2147483648 (2Gi)
                    memoryWarningThreshold: 2147483648
                    # driverCrashLoopRestartThreshold: Restart count threshold used to detect crash looping within the configured window
                    # Allowed values: Positive integer
                    # Default value: 3
                    driverCrashLoopRestartThreshold: 3
                    # driverCrashLoopWindow: Lookback window used when evaluating the crash loop restart count
                    # Allowed values: Go duration string (e.g., 10m, 15m)
                    # Default value: 15m
                    driverCrashLoopWindow: 15m
                    # volumeOperationFailureThreshold: Minimum number of volume operation failures in a 5-minute window
                    # that triggers a warning alert (PST-01 to PST-08). Set to 0 to alert on any single failure.
                    # Allowed values: Non-negative integer
                    # Default value: 3
                    volumeOperationFailureThreshold: 3
                # Uncomment the following to configure how often external-provisioner polls the driver to detect changed capacity
                # Configure only when the storageCapacity is set as "true"
                # Allowed values: 1m,2m,3m,...,10m,...,60m etc. Default value: 5m
                # - name: provisioner
                #  args: ["--capacity-poll-interval=5m"]

                controller:
                  envs:
                    # X_CSI_MULTI_NAS_FAILURE_THRESHOLD: Number of consecutive FS creation failures after which a NAS is put into cooldown.
                    # If a NAS is in cooldown, it will not be considered for new FS creation attempts for cooldown period amount of time.
                    # Allowed values: n, where n >= 0
                    # Default value: "5"
                    - name: X_CSI_MULTI_NAS_FAILURE_THRESHOLD
                      value: "5"
                    # X_CSI_MULTI_NAS_COOLDOWN_PERIOD: Duration for which a NAS remains in cooldown once the threshold is reached.
                    # During this period, the NAS will not be considered for new FS creation attempts.
                    # Allowed values: Number followed by unit (s,m,h) e.g. 60s,1m,2m,3m,...,1h etc
                    # Default value: "5m"
                    - name: X_CSI_MULTI_NAS_COOLDOWN_PERIOD
                      value: "5m"
                    # X_CSI_NFS_ACLS: enables setting permissions on NFS mount directory
                    # This value will be the default value if a storage class and array config in secret
                    # do not contain the NFS ACL (nfsAcls) parameter specified
                    # Permissions can be specified in two formats:
                    #   1) Unix mode (NFSv3)
                    #   2) NFSv4 ACLs (NFSv4)
                    #      NFSv4 ACLs are supported on NFSv4 share only.
                    # Allowed values:
                    #   1) Unix mode: valid octal mode number
                    #      Examples: "0777", "777", "0755"
                    #   2) NFSv4 acls: valid NFSv4 acls, seperated by comma
                    #      Examples: "A::OWNER@:RWX,A::GROUP@:RWX", "A::OWNER@:rxtncy"
                    # Optional: true
                    # Default value: "0777"
                    # nfsAcls: "0777"
                    - name: X_CSI_NFS_ACLS
                      value: "0777"
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from Controller plugin - volume condition.
                    # Install the 'external-health-monitor' sidecar accordingly.
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_POWERSTORE_EXTERNAL_ACCESS: Allows to specify additional entries for hostAccess of NFS volumes. Both single IP address and subnet are valid entries.
                    # Allowed Values: x.x.x.x/xx, x.x.x.x, fd00::/64, or <IPv6_ADDRESS>/128
                    # Default Value:
                    - name: X_CSI_POWERSTORE_EXTERNAL_ACCESS
                      value:
                    # X_CSI_POWERSTORE_EXCLUSIVE_ACCESS: controls whether only X_CSI_POWERSTORE_EXTERNAL_ACCESS entries are added to the NFS export.
                    # If set to true → only IP/CIDR specified in X_CSI_POWERSTORE_EXTERNAL_ACCESS will be included (node IP excluded).
                    # If set to false (default) → both node IP and X_CSI_POWERSTORE_EXTERNAL_ACCESS entry will be added to the export.
                    # Default Value: "false"
                    - name: X_CSI_POWERSTORE_EXCLUSIVE_ACCESS
                      value: "false"
                    # X_CSI_POWERSTORE_NFS_AUTO_SELECT: enables NFS source IP auto-discovery via kernel routing query (ER-K8S-JA18622-001-powerstore-nfs-auto-selection).
                    # When enabled, the driver discovers which node IP can reach the NAS server's file interface
                    # and automatically adds it to the NFS export, eliminating the need for manual host configuration.
                    # When exclusiveAccess is true, nfsAutoSelect is ignored (exclusiveAccess takes precedence).
                    # Default Value: "false"
                    - name: X_CSI_POWERSTORE_NFS_AUTO_SELECT
                      value: "false"
                  # nodeSelector: Define node selection constraints for controller pods.
                  # For the pod to be eligible to run on a node, the node must have each
                  # of the indicated key-value pairs as labels.
                  # Leave as blank to consider all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # tolerations: Define tolerations for the controllers, if required.
                  # Leave as blank to install controller on worker nodes
                  # Default value: None
                  tolerations:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  # - key: "node-role.kubernetes.io/control-plane"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                node:
                  envs:
                    # Set to "true" to enable ISCSI CHAP Authentication
                    # CHAP password will be autogenerated by driver
                    - name: "X_CSI_POWERSTORE_ENABLE_CHAP"
                      value: "false"
                    # X_CSI_POWERSTORE_NFS_AUTO_SELECT: enables NFS source IP auto-discovery via kernel routing query (ER-K8S-JA18622-001-powerstore-nfs-auto-selection).
                    # When enabled, the driver discovers which node IP can reach the NAS server's file interface
                    # and automatically adds it to the NFS export, eliminating the need for manual host configuration.
                    # When exclusiveAccess is true, nfsAutoSelect is ignored (exclusiveAccess takes precedence).
                    # Default Value: "false"
                    - name: X_CSI_POWERSTORE_NFS_AUTO_SELECT
                      value: "false"
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from node plugin - volume usage
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_POWERSTORE_MAX_VOLUMES_PER_NODE: Defines the maximum PowerStore volumes that can be created per node
                    # Allowed values: Any value greater than or equal to 0
                    # Default value: "0"
                    - name: X_CSI_POWERSTORE_MAX_VOLUMES_PER_NODE
                      value: "0"
                    # X_CSI_VOLUME_DISCONNECT_MAX_RETRIES: Defines the maximum number of retry attempts for volume disconnection.
                    # Allowed values: Positive integers
                    # Optional: true
                    # Examples: 3, 5, 10
                    # Default value: 5
                    - name: X_CSI_VOLUME_DISCONNECT_MAX_RETRIES
                      value: "5"
                    # X_CSI_VOLUME_DISCONNECT_RETRY_INTERVAL: Defines the wait time between volume disconnection retries.
                    # Allowed values: Number followed by unit (s, m, h)
                    # Optional: true
                    # Examples: 5s, 30s, 1m
                    # Default value: 5s
                    - name: X_CSI_VOLUME_DISCONNECT_RETRY_INTERVAL
                      value: "5s"
                    # X_CSI_VOLUME_DISCONNECT_TIMEOUT_SECONDS: Defines the timeout duration for each volume disconnection attempt.
                    # Allowed values: Number followed by unit (s, m, h)
                    # Optional: true
                    # Examples: 60s, 2m, 1h
                    # Default value: 120s
                    - name: X_CSI_VOLUME_DISCONNECT_TIMEOUT_SECONDS
                      value: "120s"
                  # nodeSelector: Define node selection constraints for node pods.
                  # For the pod to be eligible to run on a node, the node must have each
                  # of the indicated key-value pairs as labels.
                  # Leave as blank to consider all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # tolerations: Define tolerations for the controllers, if required.
                  # Leave as blank to install controller on worker nodes
                  # Default value: None
                  tolerations:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  # - key: "node-role.kubernetes.io/control-plane"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                  # Uncomment if CSM for Resiliency and CSI Driver pods monitor is enabled
                  # - key: "offline.powerstore.storage.dell.com"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                  # - key: "powerstore.podmon.storage.dell.com"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
              modules:
                # Authorization: enable csm-authorization for RBAC
                - name: authorization
                  # enable: Enable/Disable csm-authorization
                  # Default value: false
                  enabled: false
                  components:
                    - name: karavi-authorization-proxy
                      envs:
                        # proxyHost: hostname of the csm-authorization server
                        # Default value: none
                        - name: "PROXY_HOST"
                          value: "csm-authorization.com"
                        # skipCertificateValidation: Enable/Disable certificate validation of the csm-authorization server
                        # Default value: "true"
                        - name: "SKIP_CERTIFICATE_VALIDATION"
                          value: "true"
                - name: resiliency
                  # enabled: Enable/Disable Resiliency feature
                  # Allowed values:
                  #   true: enable Resiliency feature(deploy podmon sidecar)
                  #   false: disable Resiliency feature(do not deploy podmon sidecar)
                  # Default value: false
                  enabled: false
                  components:
                    - name: podmon-controller
                      imagePullPolicy: IfNotPresent
                      # Metrics environment variables will be set dynamically based on the metrics section below
                      args:
                        - "--labelvalue=csi-powerstore"
                        - "--arrayConnectivityPollRate=60"
                        - "--skipArrayConnectionValidation=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        - "--arrayConnectivityConnectionLossThreshold=3"
                        # Below 4 args should not be modified.
                        - "--csisock=unix:/var/run/csi/csi.sock"
                        - "--mode=controller"
                        - "--driver-config-params=/powerstore-config-params/driver-config-params.yaml"
                        - "--driverPath=csi-powerstore.dellemc.com"
                    - name: podmon-node
                      imagePullPolicy: IfNotPresent
                      envs:
                        # podmonAPIPort: Defines the port to be used within the kubernetes cluster
                        # Allowed values: Any valid and free port (string)
                        # Default value: 8083
                        - name: "X_CSI_PODMON_API_PORT"
                          value: "8083"
                          # podmonAPIToken: Shared secret token for authenticating podmon API requests
                          # Security note: podmon API uses HTTP; use this only on trusted cluster-internal networks.
                          # Example (literal value):
                          # - name: "X_CSI_PODMON_API_TOKEN"
                          #   value: "<strong-random-token>"
                          # Note: valueFrom.secretKeyRef is not currently supported for this token
                      # Metrics environment variables will be set dynamically based on the metrics section below
                      args:
                        - "--labelvalue=csi-powerstore"
                        - "--arrayConnectivityPollRate=60"
                        - "--leaderelection=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        # Below 4 args should not be modified.
                        - "--csisock=unix:/var/lib/kubelet/plugins/csi-powerstore.dellemc.com/csi_sock"
                        - "--mode=node"
                        - "--driver-config-params=/powerstore-config-params/driver-config-params.yaml"
                        - "--driverPath=csi-powerstore.dellemc.com"
                  # metrics: Configure resiliency module metrics endpoint
                  # The operator automatically creates Service/ServiceMonitor/PodMonitor resources for podmon metrics.
                  metrics:
                    # enabled: Enable/Disable resiliency module metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by resiliency module metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8444
                    port: 8444
                    # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
                    # When set the operator mounts the secret and configures HTTPS automatically.
                    # Leave unset to serve metrics over plain HTTP.
                    tlsCertSecret: ""
                    # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
                    podMonitor:
                      # enabled: Enable/Disable PodMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Creates a Prometheus Operator PrometheusRule containing resiliency alert rules.
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for resiliency alerts
                      # Allowed values: true, false
                      # Default value: true
                      enabled: true
                      # connectivitySuccessRatio: Minimum percentage of successful array connectivity checks
                      # below which the CSMResiliencyConnectivityLost alert fires.
                      # Allowed values: 0-100
                      # Default value: 90
                      connectivitySuccessRatio: 90
                # Replication: allows to configure replication
                # Replication CRDs must be installed before installing driver
                - name: replication
                  # enabled: Enable/Disable replication feature
                  # Allowed values:
                  #   true: enable replication feature(install dell-csi-replicator sidecar)
                  #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                  # Default value: false
                  enabled: false
                  # metrics: Configure Prometheus metrics for the replication sidecar (dell-csi-replicator)
                  metrics:
                    # enabled: Enable/Disable replication metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by replication metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8445
                    port: 8445
                    # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve replication metrics over HTTPS
                    # Leave empty to serve metrics over plain HTTP
                    # Default value: ""
                    tlsCertSecret: ""
                    # collection: Controls replication metrics collection cadence
                    collection:
                      # interval: How frequently replication metrics are collected
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: "30s"
                    # serviceMonitor: Creates a Prometheus Operator ServiceMonitor for the replication metrics endpoint
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor for replication metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which replication metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: "30s"
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping replication metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    prometheusRule:
                      enabled: true
                      # rpoThresholdSeconds: Replication lag threshold in seconds for REP-01 and REP-02 alerts.
                      # Default: 300 (5 minutes).
                      rpoThresholdSeconds: 300
                  components:
                    - name: dell-csi-replicator
                      envs:
                        # replicationPrefix: prefix to prepend to storage classes parameters
                        # Allowed values: string
                        # Default value: replication.storage.dell.com
                        - name: "X_CSI_REPLICATION_PREFIX"
                          value: "replication.storage.dell.com"
                        # replicationContextPrefix: prefix to use for naming of resources created by replication feature
                        # Allowed values: string
                        - name: "X_CSI_REPLICATION_CONTEXT_PREFIX"
                          value: "powerstore"
                    - name: dell-replication-controller-manager
                      envs:
                        # Replication log level
                        # Allowed values: "error", "warn"/"warning", "info", "debug"
                        # Default value: "info"
                        - name: "REPLICATION_CTRL_LOG_LEVEL"
                          value: "info"
                        # Replication log format
                        # Allowed values: "text", "json"
                        # Default value: "json"
                        - name: "REPLICATION_CTRL_LOG_FORMAT"
                          value: "json"
                        # replicas: Defines number of controller replicas
                        # Allowed values: int
                        # Default value: 1
                        - name: "REPLICATION_CTRL_REPLICAS"
                          value: "1"
                        # retryIntervalMin: Initial retry interval of failed reconcile request.
                        # It doubles with each failure, upto retry-interval-max
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MIN"
                          value: "1s"
                        # RETRY_INTERVAL_MAX: Maximum retry interval of failed reconcile request
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MAX"
                          value: "5m"
                        # DISABLE_PVC_REMAP: Disable PVC remapping for replication in single cluster configuration
                        # Allowed values:
                        #   true: Disable replication feature(install dell-csi-replicator sidecar)
                        #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                        # Default value: false
                        - name: "DISABLE_PVC_REMAP"
                          value: "false"
                        # ENABLE_KUBEVIRT_PVC_REMAP: Enable KubeVirt PVC remapping functionality
                        # When enabled, the replication controller will handle DataVolume dependencies
                        # during PVC remap for KubeVirt-backed PVCs.
                        # Allowed values:
                        #   true: enable KubeVirt PVC remap handling
                        #   false: disable KubeVirt PVC remap handling
                        # Default value: false
                        - name: "ENABLE_KUBEVIRT_PVC_REMAP"
                          value: "false"
                        # REPLICATION_ALLOW_PVC_CREATION_ON_TARGET: It Creates PVC on target cluster using replicated PV.
                        # Allowed values:
                        #   true: It creates a PVC on target cluster against replicated PV
                        #   false: simply updates claimref on replicated PV on target cluster without actually creating a PVC
                        # Default value: false
                        - name: "REPLICATION_ALLOW_PVC_CREATION_ON_TARGET"
                          value: "false"
                # observability: allows to configure observability
                - name: observability
                  # enabled: Enable/Disable observability
                  # Default value: false
                  enabled: false
                  components:
                    - name: otel-collector
                      # enabled: Enable/Disable OpenTelemetry Collector
                      # Default value: false
                      enabled: false
                      # certificate: base64-encoded certificate for cert/private-key pair -- add cert here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      certificate: ""
                      # privateKey: base64-encoded private key for cert/private-key pair -- add private key here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      privateKey: ""
                    - name: cert-manager
                      # enabled: Enable/Disable cert-manager
                      # Allowed values:
                      #   true: enable deployment of cert-manager
                      #   false: disable deployment of cert-manager only if it's already deployed
                      # Default value: false
                      enabled: false
                    - name: metrics-powerstore
                      # enabled: Enable/Disable PowerStore metrics
                      # Default value: false
                      enabled: false
                      envs:
                        # POWERSTORE_MAX_CONCURRENT_QUERIES: set the default max concurrent queries to PowerStore
                        # Allowed values: int
                        # Default value: 10
                        - name: "POWERSTORE_MAX_CONCURRENT_QUERIES"
                          value: "10"
                        # POWERSTORE_VOLUME_METRICS_ENABLED: enable/disable collection of volume metrics
                        # Allowed values: true, false
                        # Default value: true
                        - name: "POWERSTORE_VOLUME_METRICS_ENABLED"
                          value: "true"
                        # POWERSTORE_VOLUME_IO_POLL_FREQUENCY: set polling frequency to get volume IO metrics
                        # Allowed values: String
                        # Default value: true
                        - name: "POWERSTORE_VOLUME_IO_POLL_FREQUENCY"
                          value: "20"
                        # POWERSTORE_SPACE_POLL_FREQUENCY: set polling frequency to get cluster capacity metrics data
                        # Allowed values: int
                        # Default value: 300
                        - name: "POWERSTORE_SPACE_POLL_FREQUENCY"
                          value: "300"
                        # POWERSTORE_ARRAY_POLL_FREQUENCY: set polling frequency to get array capacity metrics data
                        # Allowed values: int
                        # Default value: 300
                        - name: "POWERSTORE_ARRAY_POLL_FREQUENCY"
                          value: "300"
                        # POWERSTORE_FILE_SYSTEM_POLL_FREQUENCY: set polling frequency to get file system capacity metrics data
                        # Allowed values: int
                        # Default value: 20
                        - name: "POWERSTORE_FILE_SYSTEM_POLL_FREQUENCY"
                          value: "20"
                        # POWERSTORE_TOPOLOGY_METRICS_ENABLED : enable/disable collection of topology metrics
                        # Allowed values: true, false
                        # Default value: true
                        - name: "POWERSTORE_TOPOLOGY_METRICS_ENABLED"
                          value: "true"
                        # POWERSTORE_TOPOLOGY_POLL_FREQUENCY : set polling frequency to get topology metrics
                        # Allowed values: int
                        # Default value: 30
                        - name: "POWERSTORE_TOPOLOGY_POLL_FREQUENCY"
                          value: "30"
                        # PowerStore metrics log level
                        # Valid values: trace, debug, info, warn, error, fatal, panic
                        # Default value: "info"
                        - name: "POWERSTORE_LOG_LEVEL"
                          value: "info"
                        # PowerStore Metrics Output logs in the specified format
                        # Valid values: text, json
                        # Default value: "json"
                        - name: "POWERSTORE_LOG_FORMAT"
                          value: "json"
                        # ZIPKIN_URI : URI of a Zipkin instance where tracing data can be forwarded
                        # Allowed values : String
                        # Default value: Empty
                        - name: "ZIPKIN_URI"
                          value: ""
                        # ZIPKIN_SERVICE_NAME : Service name used for Zipkin tracing dataService name used for Zipkin tracing data
                        # Allowed values : String
                        # Default value: "metrics-powerStore"
                        - name: "ZIPKIN_SERVICE_NAME"
                          value: "metrics-powerstore"
                        # ZIPKIN_PROBABILITY : Percentage of trace information to send to Zipkin (Valid range: 0.0 to 1.0)
                        # Allowed values : float
                        # Default value: "0.0"
                        - name: "ZIPKIN_PROBABILITY"
                          value: "0.0"
                        # Otel collector address
                        # Allowed values: String
                        # Default value: "otel-collector:55680"
                        - name: "COLLECTOR_ADDRESS"
                          value: "otel-collector:55680"
                  # metrics: Configure observability self-metrics endpoint
                  metrics:
                    # enabled: Enable/Disable observability self-metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by observability self-metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8443
                    port: 8443
                    # tlsCertSecret: Name of secret containing TLS certificate and key for observability self-metrics
                    # Allowed values: Kubernetes secret name, empty string
                    # Default value: ""
                    tlsCertSecret: ""
                    # serviceMonitor: Configure ServiceMonitor for observability self-metrics
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor creation for observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Prometheus scrape interval for observability self-metrics
                      # Allowed values: duration string (for example: 15s, 30s, 1m)
                      # Default value: "30s"
                      interval: "30s"
                      # scrapeTimeout: Prometheus scrape timeout for observability self-metrics
                      # Allowed values: duration string, empty string
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS certificate verification while scraping observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Configure Prometheus Operator PrometheusRule for observability alerts
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for observability alerts
                      # Allowed values: true, false
                      # Default value: false
                      enabled: true

          storageclass:
            name: powerstore
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            provisioner: csi-powerstore.dellemc.com
            # reclaimPolicy: PVs that are dynamically created by a StorageClass will have the reclaim policy specified here
            # Allowed values:
            #   Reclaim: retain the PV after PVC deletion
            #   Delete: delete the PV after PVC deletion
            # Optional: true
            # Default value: Delete
            reclaimPolicy: Delete
            # allowVolumeExpansion: allows the users to resize the volume by editing the corresponding PVC object
            # Allowed values:
            #   true: allow users to resize the PVC
            #   false: does not allow users to resize the PVC
            # Optional: true
            # Default value: false
            allowVolumeExpansion: true
            parameters:
              csi.storage.k8s.io/fstype: "ext4"
            # volumeBindingMode determines how volume binding and dynamic provisioning should occur
            # Allowed values: 
            #  Immediate: volume binding and dynamic provisioning occurs once PVC is created
            #  WaitForFirstConsumer: delay the binding and provisioning of PV until a pod using the PVC is created.
            #  Optional: false
            # Default value: WaitForFirstConsumer
            volumeBindingMode: WaitForFirstConsumer

  - name: "powerscale-v2180"
    displayName: "PowerScale v2.18.1"
    group: "Platform"
    remove:
    - "charts.csm-operator.csm"
    - "charts.csm-operator.reverseProxyConfig"
    - "charts.csm-operator.storageclass"
    - "charts.csm-operator.snapshot-controller"
    add: |
      charts:
        csm-operator:
          image:
            repository: quay.io/dell/container-storage-modules/dell-csm-operator
            pullPolicy: IfNotPresent
            tag: "v1.13.2"

          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi

          csm:
            # Select a preset to populate the default configuration for your platform
            namespace: isilon
            type: isilon
            version: v1.18.2

            config:
              version: v1.18.2
              secret:
                encoded: false # if set to true, provide a base64 encoded value instead
                # Default secret names:
                # PowerFlex:  vxflexos-config
                # PowerMax:   powermax-creds
                # PowerStore: powerstore-config
                # PowerScale: isilon-creds
                name: isilon-creds
                value: |
                  isilonClusters:
                  - clusterName: "cluster2"           # Logical name of PowerScale Cluster
                    username: "user"                  # Username for connecting to PowerScale OneFS API server
                    password: "password"              # Password for connecting to PowerScale OneFS API server
                    endpoint: "1.2.3.4"               # HTTPS endpoint of the PowerScale OneFS API server
                    endpointPort: "8080"              # HTTPs port number of the PowerScale OneFS API server
                    isDefault: true                   # Is this a default cluster (would be used by storage classes without ClusterName parameter)

                # Example value for encoded
                # value: LSB1c2VybmFtZTogImFkbWluIgogIHBhc3N3b3JkOiAiUGFzc3dvcmQxMjMiCiAgc3lzdGVtSUQ6ICIyYjExYmIxM...

              driver:
                csiDriverType: "isilon"
                csiDriverSpec:
                  # in OCP <= 4.16 and K8s <= 1.29, fsGroupPolicy is an immutable field
                  # fsGroupPolicy: Defines if the underlying volume supports changing ownership and permission of the volume before being mounted.
                  # Allowed values: ReadWriteOnceWithFSType, File , None
                  # Default value: ReadWriteOnceWithFSType
                  fSGroupPolicy: "ReadWriteOnceWithFSType"
                  # storageCapacity: Helps the scheduler to schedule the pod on a node satisfying the topology constraints, only if the requested capacity is available on the storage array
                  # Allowed values:
                  #   true: enable storage capacity tracking
                  #   false: disable storage capacity tracking
                  storageCapacity: true
                authSecret: isilon-creds
                # Controller count
                # Allowed values: n, where n > 0
                # Default value: 2
                replicas: 2
                dnsPolicy: ClusterFirstWithHostNet
                # Uninstall CSI Driver and/or modules when CR is deleted
                forceRemoveDriver: true
                common:
                  imagePullPolicy: IfNotPresent
                  envs:
                    # X_CSI_VERBOSE: Indicates what content of the OneFS REST API message should be logged in debug level logs
                    # Allowed Values:
                    #   0: log full content of the HTTP request and response
                    #   1: log without the HTTP response body
                    #   2: log only 1st line of the HTTP request and response
                    # Default value: 0
                    - name: X_CSI_VERBOSE
                      value: "1"
                    # X_CSI_ISI_PORT: Specify the HTTPs port number of the PowerScale OneFS API server
                    # This value acts as a default value for endpointPort, if not specified for a cluster config in secret
                    # Allowed value: valid port number
                    # Default value: 8080
                    - name: X_CSI_ISI_PORT
                      value: "8080"
                    # X_CSI_ISI_PATH: The base path for the volumes to be created on PowerScale cluster.
                    # This value acts as a default value for isiPath, if not specified for a cluster config in secret
                    # Ensure that this path exists on PowerScale cluster.
                    # Allowed values: unix absolute path
                    # Default value: /ifs
                    # Examples: /ifs/data/csi, /ifs/engineering
                    - name: X_CSI_ISI_PATH
                      value: "/ifs/data/csi"
                    # X_CSI_ISI_NO_PROBE_ON_START: Indicates whether the controller/node should probe all the PowerScale clusters during driver initialization
                    # Allowed values:
                    #   true : do not probe all PowerScale clusters during driver initialization
                    #   false: probe all PowerScale clusters during driver initialization
                    # Default value: false
                    - name: X_CSI_ISI_NO_PROBE_ON_START
                      value: "false"
                    # X_CSI_ISI_AUTOPROBE: automatically probe the PowerScale cluster if not done already during CSI calls.
                    # Allowed values:
                    #   true : enable auto probe.
                    #   false: disable auto probe.
                    # Default value: false
                    - name: X_CSI_ISI_AUTOPROBE
                      value: "true"
                    # X_CSI_ISI_SKIP_CERTIFICATE_VALIDATION: Specify whether the PowerScale OneFS API server's certificate chain and host name should be verified.
                    # Formerly this attribute was named as "X_CSI_ISI_INSECURE"
                    # This value acts as a default value for skipCertificateValidation, if not specified for a cluster config in secret
                    # Allowed values:
                    #   true: skip OneFS API server's certificate verification
                    #   false: verify OneFS API server's certificates
                    # Default value: true
                    - name: X_CSI_ISI_SKIP_CERTIFICATE_VALIDATION
                      value: "true"
                    # X_CSI_ISI_AUTH_TYPE: Specify the authentication method to be used.
                    # Allowed values:
                    #   0: basic authentication
                    #   1: session-based authentication
                    # Default value: 1
                    - name: X_CSI_ISI_AUTH_TYPE
                      value: "1"
                    # X_CSI_CUSTOM_TOPOLOGY_ENABLED: Specify if custom topology label <provisionerName>.dellemc.com/<powerscalefqdnorip>:<provisionerName>
                    # has to be used for making connection to backend PowerScale Array.
                    # If X_CSI_CUSTOM_TOPOLOGY_ENABLED is set to true, then do not specify allowedTopologies in storage class.
                    # Allowed values:
                    #   true : enable custom topology
                    #   false: disable custom topology
                    # Default value: false
                    - name: X_CSI_CUSTOM_TOPOLOGY_ENABLED
                      value: "false"
                    # X_CSI_ISI_NFS_MOUNT_FQDN: Specify the global fallback FQDN for NFS mount targets.
                    # StorageClass SmartConnectZoneFQDN takes precedence, followed by the selected cluster's
                    # nfsMountFQDN. NFSTransportSecurity remains explicit and StorageClass-scoped.
                    # Allowed values: A valid FQDN (e.g., "smartconnect.isilon.example.com")
                    # Optional: true
                    # Default value: ""
                    - name: X_CSI_ISI_NFS_MOUNT_FQDN
                      value: ""
                    # X_CSI_ISI_TLS_HANDSHAKE_TIMEOUT_SECONDS: Specify the timeout, in seconds, to wait for the
                    # kernel TLS handshake (performed by tlshd) to complete when mounting with NFS over mTLS.
                    # Applies only to the mTLS mount path.
                    # Allowed values: A positive integer
                    # Default value: "30"
                    - name: X_CSI_ISI_TLS_HANDSHAKE_TIMEOUT_SECONDS
                      value: "30"
                    # Specify kubelet config dir path.
                    # Ensure that the config.yaml file is present at this path.
                    # Default value: /var/lib/kubelet
                    - name: KUBELET_CONFIG_DIR
                      value: "/var/lib/kubelet"
                    # certSecretCount: Represents number of certificate secrets, which user is going to create for
                    # ssl authentication. (isilon-cert-0..isilon-cert-n)
                    # Allowed values: n, where n > 0
                    # Default value: None
                    - name: "CERT_SECRET_COUNT"
                      value: "1"
                    # CSI driver log level
                    # Allowed values: "error", "warn"/"warning", "info", "debug"
                    # Default value: "info"
                    - name: "CSI_LOG_LEVEL"
                      value: "info"
                    # CSI driver log format
                    # Allowed values: "text" or "json"
                    # Default value: "json"
                    - name: "CSI_LOG_FORMAT"
                      value: "json"
                    # GOISILON_DEBUG: Enable/disable debug logs from gopowerscale library.
                    # Default value: false
                    - name: "GOISILON_DEBUG"
                      value: "false"
                    # AZ_RECONCILE_INTERVAL: Interval to monitor and reconcile network interface labels on nodes.
                    # Allowed values: Number followed by unit of time (s,m,h)
                    # Default value: 1h
                    - name: "AZ_RECONCILE_INTERVAL"
                      value: "1h"
                # metrics: Configure driver metrics endpoint
                # The operator automatically wires the TLS secret and creates Service/ServiceMonitor/PodMonitor resources.
                metrics:
                  # enabled: Enable/Disable driver metrics endpoint
                  # Allowed values: true, false
                  # Default value: false
                  enabled: false
                  # port: Port used by driver metrics endpoint
                  # Allowed values: 1-65535
                  # Default value: 8443
                  port: 8443
                  # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
                  # When set the operator mounts the secret and configures HTTPS automatically.
                  # Leave unset to serve metrics over plain HTTP.
                  tlsCertSecret: ""
                  # leaderElection: Configure leader election for array-level metrics collection.
                  # Only the leader controller will collect array-level metrics to avoid duplicate API calls.
                  leaderElection:
                    # enabled: Enable leader election for array-level metrics collection
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # leaseDuration: Duration that non-leader candidates will wait to acquire the lease
                    # Allowed values: Go duration string (e.g., 60s, 1m)
                    # Default value: 60s
                    leaseDuration: 60s
                    # renewDeadline: Duration that the acting leader will retry refreshing leadership before giving up
                    # Allowed values: Go duration string (e.g., 40s, 1m)
                    # Default value: 40s
                    renewDeadline: 40s
                    # retryPeriod: Duration the LeaderElector clients should wait between tries of actions
                    # Allowed values: Go duration string (e.g., 5s, 10s)
                    # Default value: 5s
                    retryPeriod: 5s
                  # collection: Controls metrics collection cadence and cache behavior inside the driver.
                  collection:
                    # interval: How frequently metrics are collected from the array
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    interval: 30s
                    # cacheTTL: How long collected metric responses are cached
                    # Allowed values: Go duration string (e.g., 25s, 1m)
                    # Default value: 25s
                    cacheTTL: 25s
                  # array: Controls array-facing metrics collection request behavior.
                  array:
                    # rateLimit: Max allowed PowerScale API requests per second during metrics collection
                    # Allowed values: Positive integer
                    # Default value: 100
                    rateLimit: 100
                    # timeout: Per-request timeout for PowerScale API calls made during metrics collection
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    timeout: 30s
                    circuitBreaker:
                      # threshold: Number of consecutive failures before the circuit opens
                      # Allowed values: Positive integer
                      # Default value: 3
                      threshold: 3
                      # resetTimeout: How long the circuit stays open before allowing a test request (half-open)
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      resetTimeout: 30s
                  # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
                  serviceMonitor:
                    # enabled: Enable/Disable ServiceMonitor for driver metrics
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # interval: Interval at which metrics should be scraped
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    interval: 30s
                    # scrapeTimeout: Timeout after which the scrape is ended
                    # Allowed values: Go duration string (e.g., 10s)
                    # Default value: ""
                    scrapeTimeout: ""
                    # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    insecureSkipVerify: false
                  # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
                  podMonitor:
                    # enabled: Enable/Disable PodMonitor for driver metrics
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # interval: Interval at which metrics should be scraped
                    # Allowed values: Go duration string (e.g., 30s, 1m)
                    # Default value: 30s
                    interval: 30s
                    # scrapeTimeout: Timeout after which the scrape is ended
                    # Allowed values: Go duration string (e.g., 10s)
                    # Default value: ""
                    scrapeTimeout: ""
                    # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    insecureSkipVerify: false
                  # prometheusRule: Creates a Prometheus Operator PrometheusRule containing PowerScale CSI alert rules.
                  prometheusRule:
                    # enabled: Enable/Disable PrometheusRule creation for driver alerts
                    # Allowed values: true, false
                    # Default value: true
                    enabled: true
                    # volumeOperationFailureThreshold: Volume operation failure count threshold in 5m window
                    volumeOperationFailureThreshold: 3
                    # quotaWarningThreshold: Warning threshold for quota utilization in whole percent (80 = 80%)
                    quotaWarningThreshold: 80
                    # quotaCriticalThreshold: Critical threshold for quota utilization in whole percent (90 = 90%)
                    quotaCriticalThreshold: 90
                    # nodepoolWarningThreshold: Warning threshold for node pool utilization in whole percent
                    nodepoolWarningThreshold: 80
                    # nodepoolCriticalThreshold: Critical threshold for node pool utilization in whole percent
                    nodepoolCriticalThreshold: 90
                    # apiErrorRateThreshold: Warning threshold for API error rate in whole percent
                    apiErrorRateThreshold: 10
                    # apiErrorRateWindow: Prometheus duration string used for API error rate evaluation
                    apiErrorRateWindow: "5m"
                    # cpuWarningThreshold: Warning threshold for driver CPU utilization in whole percent
                    cpuWarningThreshold: 80
                    # memoryWarningThreshold: Warning threshold for driver memory usage in bytes (2 GiB)
                    memoryWarningThreshold: 2147483648
                    # nfsV3LatencyWarningSeconds: Warning threshold for NFSv3 p99 latency in seconds
                    nfsV3LatencyWarningSeconds: 10
                    # nfsV4LatencyWarningSeconds: Warning threshold for NFSv4 p99 latency in seconds
                    nfsV4LatencyWarningSeconds: 10
                    # driverCrashLoopRestartThreshold: Restart count threshold for crash loop detection
                    driverCrashLoopRestartThreshold: 3
                    # driverCrashLoopWindow: Prometheus duration string for crash loop restart delta evaluation
                    driverCrashLoopWindow: "15m"
                controller:
                  envs:
                    # X_CSI_ISI_QUOTA_ENABLED: Indicates whether the provisioner should attempt to set (later unset) quota
                    # on a newly provisioned volume.
                    # This requires SmartQuotas to be enabled on PowerScale cluster.
                    # Allowed values:
                    #   true: set quota for volume
                    #   false: do not set quota for volume
                    - name: X_CSI_ISI_QUOTA_ENABLED
                      value: "true"
                    # X_CSI_ISI_ACCESS_ZONE: The name of the access zone a volume can be created in.
                    # If storageclass is missing with AccessZone parameter, then value of X_CSI_ISI_ACCESS_ZONE is used for the same.
                    # Default value: System
                    # Examples: System, zone1
                    - name: X_CSI_ISI_ACCESS_ZONE
                      value: "System"
                    # X_CSI_ISI_VOLUME_PATH_PERMISSIONS: The permissions for isi volume directory path
                    # This value acts as a default value for isiVolumePathPermissions, if not specified for a cluster config in secret
                    # Allowed values: valid octal mode number
                    # Default value: "0777"
                    # Examples: "0777", "777", "0755"
                    - name: X_CSI_ISI_VOLUME_PATH_PERMISSIONS
                      value: "0777"
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from Controller plugin- volume status, volume condition.
                    # Install the 'external-health-monitor' sidecar accordingly.
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_ISI_IGNORE_UNRESOLVABLE_HOSTS: Ignore unresolvable hosts on the OneFS.
                    # When set to true, OneFS allows new host to add to existing export list though any of the existing hosts from the
                    # same exports are unresolvable/doesn't exist anymore.
                    # Allowed values:
                    #   true: ignore existing unresolvable hosts and append new host to the existing export
                    #   false: exhibits OneFS default behavior i.e. if any of existing hosts are unresolvable while adding new one it fails
                    # Default value: false
                    - name: X_CSI_ISI_IGNORE_UNRESOLVABLE_HOSTS
                      value: "false"
                    # X_CSI_MAX_PATH_LIMIT: this parameter is used for setting the maximum Path length for the given volume.
                    # Default value: 192
                    # Examples: 192, 256
                    - name: X_CSI_MAX_PATH_LIMIT
                      value: "192"
                    # X_CSI_ALLOWED_NETWORKS: Custom networks for PowerScale export
                    # Specify list of networks which can be used for NFS I/O traffic; CIDR format should be used.
                    # Allowed values: list of one or more networks
                    # Default value: None
                    # Provide them in the following format: "[net1, net2]"
                    # CIDR format should be used
                    # eg: "[192.168.1.0/24, 192.168.100.0/22]"
                    - name: X_CSI_ALLOWED_NETWORKS
                      value: ""
                    # X_CSI_ALLOWED_NETWORKS_MODE: Mode for multi-NIC network selection
                    # Allowed values:
                    #   single: Use first matching IP (default, backward compatible)
                    #   multi: Use all matching IPs from node labels
                    # Default value: single
                    - name: X_CSI_ALLOWED_NETWORKS_MODE
                      value: "single"
                  # nodeSelector: Define node selection constraints for pods of controller deployment.
                  # For the pod to be eligible to run on a node, the node must have each
                  # of the indicated key-value pairs as labels.
                  # Leave as blank to consider all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # tolerations: Define tolerations for the controller deployment, if required.
                  # Default value: None
                  tolerations:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  # - key: "node-role.kubernetes.io/control-plane"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                node:
                  envs:
                    # X_CSI_MAX_VOLUMES_PER_NODE: Specify default value for maximum number of volumes that controller can publish to the node.
                    # If value is zero CO SHALL decide how many volumes of this type can be published by the controller to the node.
                    # This limit is applicable to all the nodes in the cluster for which node label 'max-isilon-volumes-per-node' is not set.
                    # Allowed values: n, where n >= 0
                    # Default value: 0
                    - name: X_CSI_MAX_VOLUMES_PER_NODE
                      value: "0"
                    # X_CSI_ALLOWED_NETWORKS: Custom networks for PowerScale export
                    # Specify list of networks which can be used for NFS I/O traffic; CIDR format should be used.
                    # Allowed values: list of one or more networks
                    # Default value: None
                    # Provide them in the following format: "[net1, net2]"
                    # CIDR format should be used
                    # eg: "[192.168.1.0/24, 192.168.100.0/22]"
                    - name: X_CSI_ALLOWED_NETWORKS
                      value: ""
                    # X_CSI_ALLOWED_NETWORKS_MODE: Mode for multi-NIC network selection
                    # Allowed values:
                    #   single: Use first matching IP (default, backward compatible)
                    #   multi: Use all matching IPs from node labels
                    # Default value: single
                    - name: X_CSI_ALLOWED_NETWORKS_MODE
                      value: "single"
                    # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from Controller plugin- volume status, volume condition.
                    # Install the 'external-health-monitor' sidecar accordingly.
                    # Allowed values:
                    #   true: enable checking of health condition of CSI volumes
                    #   false: disable checking of health condition of CSI volumes
                    # Default value: false
                    - name: X_CSI_HEALTH_MONITOR_ENABLED
                      value: "false"
                    # X_CSI_MAX_PATH_LIMIT: this parameter is used for setting the maximum Path length for the given volume.
                    # Default value: 192
                    # Examples: 192, 256
                    - name: X_CSI_MAX_PATH_LIMIT
                      value: "192"
                    # X_CSI_ISILON_ENABLE_DRIVER_FSGROUP_CHOWN: Enable/Disable driver-side parallel recursive chown for export-backed volumes
                    # Allowed values: true, false
                    # Default value: true
                    - name: X_CSI_ISILON_ENABLE_DRIVER_FSGROUP_CHOWN
                      value: "true"
                    # X_CSI_ISILON_CHOWN_WORKERS: Number of parallel os.Chown workers for recursive fsGroup application
                    # Allowed values: integer >= 1
                    # Default value: 8
                    - name: X_CSI_ISILON_CHOWN_WORKERS
                      value: "8"
                    # X_CSI_ISILON_CHOWN_WRITEBATCH: Number of completed file paths to buffer before writing the resumable state file
                    # Allowed values: integer >= 1
                    # Default value: 1000
                    - name: X_CSI_ISILON_CHOWN_WRITEBATCH
                      value: "1000"
                    # X_CSI_ISILON_CHOWN_TIMEOUT_SECONDS: Per-NodeStageVolume/NodePublishVolume timeout for recursive chown
                    # Allowed values: integer >= 1
                    # Default value: 30
                    - name: X_CSI_ISILON_CHOWN_TIMEOUT_SECONDS
                      value: "30"
                  # nodeSelector: Define node selection constraints for pods of node daemonset
                  # For the pod to be eligible to run on a node, the node must have each
                  # of the indicated key-value pairs as labels.
                  # Leave as blank to consider all nodes
                  # Allowed values: map of key-value pairs
                  # Default value: None
                  nodeSelector:
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  #  node-role.kubernetes.io/control-plane: ""

                  # tolerations: Define tolerations for the node daemonset, if required.
                  # Default value: None
                  tolerations:
                  # - key: "node.kubernetes.io/memory-pressure"
                  #   operator: "Exists"
                  #   effect: "NoExecute"
                  # - key: "node.kubernetes.io/disk-pressure"
                  #   operator: "Exists"
                  #   effect: "NoExecute"
                  # - key: "node.kubernetes.io/network-unavailable"
                  #   operator: "Exists"
                  #   effect: "NoExecute"
                  # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
                  # - key: "node-role.kubernetes.io/control-plane"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                  # Uncomment if CSM for Resiliency and CSI Driver pods monitor is enabled
                  # - key: "offline.isilon.storage.dell.com"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                  # - key: "isilon.podmon.storage.dell.com"
                  #   operator: "Exists"
                  #   effect: "NoSchedule"
                sideCars:
                  - name: provisioner
                    args: ["--volume-name-prefix=csivol"]
                  # health monitor is disabled by default, refer to driver documentation before enabling it
                  # Default monitor-interval: 60s
                  - name: external-health-monitor
                    enabled: false
                    args: ["--monitor-interval=60s"]
                    # Uncomment the following to configure how often external-provisioner polls the driver to detect changed capacity
                    # Configure when the storageCapacity is set as "true"
                    # Allowed values: 1m,2m,3m,...,10m,...,60m etc. Default value: 5m
                    # - name: provisioner
                    #  args: ["--capacity-poll-interval=5m"]
              modules:
                # Authorization: enable csm-authorization for RBAC
                - name: authorization
                  # enable: Enable/Disable csm-authorization
                  # Default value: false
                  enabled: false
                  components:
                    - name: karavi-authorization-proxy
                      envs:
                        # proxyHost: hostname of the csm-authorization server
                        # Default value: none
                        - name: "PROXY_HOST"
                          value: "csm-authorization.com"
                        # skipCertificateValidation: Enable/Disable certificate validation of the csm-authorization server
                        # Default value: "true"
                        - name: "SKIP_CERTIFICATE_VALIDATION"
                          value: "true"
                # replication: allows to configure replication
                # Replication CRDs must be installed before installing driver
                - name: replication
                  # enabled: Enable/Disable replication feature
                  # Allowed values:
                  #   true: enable replication feature(install dell-csi-replicator sidecar)
                  #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                  # Default value: false
                  enabled: false
                  metrics:
                    enabled: false
                    port: 8445
                    tlsCertSecret: ""
                    collection:
                      interval: "30s"
                    serviceMonitor:
                      enabled: false
                      interval: "30s"
                      scrapeTimeout: ""
                      insecureSkipVerify: false
                    prometheusRule:
                      enabled: true
                      rpoThresholdSeconds: 300
                  components:
                    - name: dell-csi-replicator
                      envs:
                        # replicationPrefix: prefix to prepend to storage classes parameters
                        # Allowed values: string
                        # Default value: replication.storage.dell.com
                        - name: "X_CSI_REPLICATION_PREFIX"
                          value: "replication.storage.dell.com"
                        # replicationContextPrefix: prefix to use for naming of resources created by replication feature
                        # Allowed values: string
                        # Default value: powerstore
                        - name: "X_CSI_REPLICATION_CONTEXT_PREFIX"
                          value: "powerscale"
                    - name: dell-replication-controller-manager
                      envs:
                        # Replication log level
                        # Allowed values: "error", "warn"/"warning", "info", "debug"
                        # Default value: "info"
                        - name: "REPLICATION_CTRL_LOG_LEVEL"
                          value: "info"
                        # Replication log format
                        # Allowed values: "text", "json"
                        # Default value: "json"
                        - name: "REPLICATION_CTRL_LOG_FORMAT"
                          value: "json"
                        # replicas: Defines number of controller replicas
                        # Allowed values: int
                        # Default value: 1
                        - name: "REPLICATION_CTRL_REPLICAS"
                          value: "1"
                        # retryIntervalMin: Initial retry interval of failed reconcile request.
                        # It doubles with each failure, upto retry-interval-max
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MIN"
                          value: "1s"
                        # RETRY_INTERVAL_MAX: Maximum retry interval of failed reconcile request
                        # Allowed values: time
                        - name: "RETRY_INTERVAL_MAX"
                          value: "5m"
                        # DISABLE_PVC_REMAP: Disable PVC remapping for replication in single cluster configuration
                        # Allowed values:
                        #   true: Disable replication feature(install dell-csi-replicator sidecar)
                        #   false: disable replication feature(do not install dell-csi-replicator sidecar)
                        # Default value: false
                        - name: "DISABLE_PVC_REMAP"
                          value: "false"
                        # REPLICATION_ALLOW_PVC_CREATION_ON_TARGET: It Creates PVC on target cluster using replicated PV.
                        # Allowed values:
                        #   true: It creates a PVC on target cluster against replicated PV
                        #   false: simply updates claimref on replicated PV on target cluster without actually creating a PVC
                        # Default value: false
                        - name: "REPLICATION_ALLOW_PVC_CREATION_ON_TARGET"
                          value: "false"
                # observability: allows to configure observability
                - name: observability
                  # enabled: Enable/Disable observability
                  # Default value: false
                  enabled: false
                  components:
                    - name: otel-collector
                      # enabled: Enable/Disable OpenTelemetry Collector
                      # Default value: false
                      enabled: false
                      # certificate: base64-encoded certificate for cert/private-key pair -- add cert here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      certificate: ""
                      # privateKey: base64-encoded private key for cert/private-key pair -- add private key here to use custom certificates
                      #  for self-signed certs, leave empty string
                      # Allowed values: string
                      privateKey: ""
                    - name: cert-manager
                      # enabled: Enable/Disable cert-manager
                      # Allowed values:
                      #   true: enable deployment of cert-manager
                      #   false: disable deployment of cert-manager only if it's already deployed
                      # Default value: false
                      enabled: false
                    - name: metrics-powerscale
                      # enabled: Enable/Disable PowerScale metrics
                      # Default value: false
                      enabled: false
                      envs:
                        # POWERSCALE_MAX_CONCURRENT_QUERIES: set the default max concurrent queries to PowerScale
                        # Allowed values: int
                        # Default value: 10
                        - name: "POWERSCALE_MAX_CONCURRENT_QUERIES"
                          value: "10"
                        # POWERSCALE_TOPOLOGY_METRICS_ENABLED: enable/disable collection of topology metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERSCALE_TOPOLOGY_METRICS_ENABLED"
                          value: "true"
                        # POWERSCALE_TOPOLOGY_METRICS_POLL_FREQUENCY: set polling frequency to get topology metrics
                        # Allowed values: int
                        # Default value: 30
                        - name: "POWERSCALE_TOPOLOGY_METRICS_POLL_FREQUENCY"
                          value: "30"
                        # POWERSCALE_CAPACITY_METRICS_ENABLED: enable/disable collection of capacity metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERSCALE_CAPACITY_METRICS_ENABLED"
                          value: "true"
                        # POWERSCALE_PERFORMANCE_METRICS_ENABLED: enable/disable collection of performance metrics
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "POWERSCALE_PERFORMANCE_METRICS_ENABLED"
                          value: "true"
                        # POWERSCALE_CLUSTER_CAPACITY_POLL_FREQUENCY: set polling frequency to get cluster capacity metrics data
                        # Allowed values: int
                        # Default value: 30
                        - name: "POWERSCALE_CLUSTER_CAPACITY_POLL_FREQUENCY"
                          value: "30"
                        # POWERSCALE_CLUSTER_PERFORMANCE_POLL_FREQUENCY: set polling frequency to get cluster performance metrics data
                        # Allowed values: int
                        # Default value: 20
                        - name: "POWERSCALE_CLUSTER_PERFORMANCE_POLL_FREQUENCY"
                          value: "20"
                        # POWERSCALE_QUOTA_CAPACITY_POLL_FREQUENCY: set polling frequency to get Quota capacity metrics data
                        # Allowed values: int
                        # Default value: 20
                        - name: "POWERSCALE_QUOTA_CAPACITY_POLL_FREQUENCY"
                          value: "30"
                        # ISICLIENT_INSECURE: set true/false to skip/verify OneFS API server's certificates
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "ISICLIENT_INSECURE"
                          value: "true"
                        # ISICLIENT_AUTH_TYPE: set 0/1 to enables session-based/basic Authentication
                        # Allowed values: ture, false
                        # Default value: true
                        - name: "ISICLIENT_AUTH_TYPE"
                          value: "1"
                        # ISICLIENT_VERBOSE: set 0/1/2 decide High/Medium/Low content of the OneFS REST API message should be logged in debug level logs
                        # Allowed values: 0,1,2
                        # Default value: 0
                        - name: "ISICLIENT_VERBOSE"
                          value: "0"
                        # PowerScale metrics log level
                        # Valid values: trace, debug, info, warn, error, fatal, panic
                        # Default value: "info"
                        - name: "POWERSCALE_LOG_LEVEL"
                          value: "info"
                        # PowerScale Metrics Output logs in the specified format
                        # Valid values: text, json
                        # Default value: "json"
                        - name: "POWERSCALE_LOG_FORMAT"
                          value: "json"
                        # Otel collector address
                        # Allowed values: String
                        # Default value: "otel-collector:55680"
                        - name: "COLLECTOR_ADDRESS"
                          value: "otel-collector:55680"
                  # metrics: Configure observability self-metrics endpoint
                  metrics:
                    # enabled: Enable/Disable observability self-metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by observability self-metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8443
                    port: 8443
                    # tlsCertSecret: Name of secret containing TLS certificate and key for observability self-metrics
                    # Allowed values: Kubernetes secret name, empty string
                    # Default value: ""
                    tlsCertSecret: ""
                    # serviceMonitor: Configure ServiceMonitor for observability self-metrics
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor creation for observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Prometheus scrape interval for observability self-metrics
                      # Allowed values: duration string (for example: 15s, 30s, 1m)
                      # Default value: "30s"
                      interval: "30s"
                      # scrapeTimeout: Prometheus scrape timeout for observability self-metrics
                      # Allowed values: duration string, empty string
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS certificate verification while scraping observability self-metrics
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Configure Prometheus Operator PrometheusRule for observability alerts
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for observability alerts
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                - name: resiliency
                  # enabled: Enable/Disable Resiliency feature
                  # Allowed values:
                  #   true: enable Resiliency feature(deploy podmon sidecar)
                  #   false: disable Resiliency feature(do not deploy podmon sidecar)
                  # Default value: false
                  enabled: false
                  components:
                    - name: podmon-controller
                      imagePullPolicy: IfNotPresent
                      args:
                        - "--labelvalue=csi-isilon"
                        - "--arrayConnectivityPollRate=60"
                        - "--skipArrayConnectionValidation=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        - "--arrayConnectivityConnectionLossThreshold=3"
                        # Below 4 args should not be modified.
                        - "--csisock=unix:/var/run/csi/csi.sock"
                        - "--mode=controller"
                        - "--driverPath=csi-isilon.dellemc.com"
                        - "--driver-config-params=/csi-isilon-config-params/driver-config-params.yaml"
                    - name: podmon-node
                      imagePullPolicy: IfNotPresent
                      envs:
                        # podmonAPIPort: Defines the port to be used within the kubernetes cluster
                        # Allowed values: Any valid and free port (string)
                        # Default value: 8083
                        - name: "X_CSI_PODMON_API_PORT"
                          value: "8083"
                          # podmonAPIToken: Shared secret token for authenticating podmon API requests
                          # Security note: podmon API uses HTTP; use this only on trusted cluster-internal networks.
                          # Example (literal value):
                          # - name: "X_CSI_PODMON_API_TOKEN"
                          #   value: "<strong-random-token>"
                          # Note: valueFrom.secretKeyRef is not currently supported for this token
                      args:
                        - "--labelvalue=csi-isilon"
                        - "--arrayConnectivityPollRate=60"
                        - "--leaderelection=false"
                        - "--driverPodLabelValue=dell-storage"
                        - "--ignoreVolumelessPods=false"
                        # Below 4 args should not be modified.
                        - "--csisock=unix:/var/lib/kubelet/plugins/csi-isilon/csi_sock"
                        - "--mode=node"
                        - "--driverPath=csi-isilon.dellemc.com"
                        - "--driver-config-params=/csi-isilon-config-params/driver-config-params.yaml"
                  # metrics: Configure resiliency module metrics endpoint
                  # The operator automatically creates Service/ServiceMonitor/PodMonitor resources for podmon metrics.
                  metrics:
                    # enabled: Enable/Disable resiliency module metrics endpoint
                    # Allowed values: true, false
                    # Default value: false
                    enabled: false
                    # port: Port used by resiliency module metrics endpoint
                    # Allowed values: 1-65535
                    # Default value: 8444
                    port: 8444
                    # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
                    # When set the operator mounts the secret and configures HTTPS automatically.
                    # Leave unset to serve metrics over plain HTTP.
                    tlsCertSecret: ""
                    # collection: Controls metrics collection cadence inside the resiliency module.
                    collection:
                      # interval: Interval at which metrics are collected
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                    # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
                    serviceMonitor:
                      # enabled: Enable/Disable ServiceMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
                    podMonitor:
                      # enabled: Enable/Disable PodMonitor for resiliency metrics
                      # Allowed values: true, false
                      # Default value: false
                      enabled: false
                      # interval: Interval at which metrics should be scraped
                      # Allowed values: Go duration string (e.g., 30s, 1m)
                      # Default value: 30s
                      interval: 30s
                      # scrapeTimeout: Timeout after which the scrape is ended
                      # Allowed values: Go duration string (e.g., 10s)
                      # Default value: ""
                      scrapeTimeout: ""
                      # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
                      # Allowed values: true, false
                      # Default value: false
                      insecureSkipVerify: false
                    # prometheusRule: Creates a Prometheus Operator PrometheusRule containing resiliency alert rules.
                    prometheusRule:
                      # enabled: Enable/Disable PrometheusRule creation for resiliency alerts
                      # Allowed values: true, false
                      # Default value: true
                      enabled: true
                      # connectivitySuccessRatio: Minimum percentage of successful array connectivity checks
                      # below which the CSMResiliencyConnectivityLost alert fires.
                      # Allowed values: 0-100
                      # Default value: 90
                      connectivitySuccessRatio: 90

          storageclass:
            name: isilon
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
            provisioner: csi-isilon.dellemc.com
            reclaimPolicy: Delete
            allowVolumeExpansion: true
            parameters:
              # The name of the access zone a volume can be created in
              # Optional: true
              # Default value: default value specified in values.yaml
              # Examples: System
              AccessZone: System

              # The name of the network on which the volumes will be
              # accessible via. The volume will only be exported to addresses in
              # this network. If not specified then the volume will be exported to
              # the default (primary) address of the node.
              # AzNetwork: 192.168.2.0/24

              # The base path for the volumes to be created on PowerScale cluster.
              # Ensure that this path exists on PowerScale cluster.
              # Allowed values: unix absolute path
              # Optional: true
              # Default value: value specified in values.yaml for isiPath
              # Examples: /ifs/data/csi, /ifs/engineering
              IsiPath: /ifs/data/csi

              # Parameter to set Advisory Limit to quota
              # Optional: true
              # Default Behaviour : Limit not set
              # AdvisoryLimit: "50"
              # Parameter to set soft limit to quota
              # Optional: true
              # Default Behaviour: Limit not set
              # SoftLimit: "80"
              # Parameter which must be mentioned along with Soft Limit
              # Soft Limit can be exceeded until the grace period
              # Optional: true
              # Default Behaviour : Limit not set
              # SoftGracePrd: "86400"

              # The permissions for isi volume directory path
              # This value overrides the isiVolumePathPermissions attribute of corresponding cluster config in secret, if present
              # Allowed values: valid octal mode number
              # Default value: "0777"
              # Examples: "0777", "777", "0755"
              # IsiVolumePathPermissions: "0777"

              # AccessZone groupnet service IP. Update AzServiceIP if different than endpoint.
              # Optional: true
              # Default value: endpoint of the cluster ClusterName
              # AzServiceIP : 192.168.2.1

              # When a PVC is being created, this parameter determines, when a node mounts the PVC,
              # whether to add the k8s node to the "Root clients" field or "Clients" field of the NFS export
              # Allowed values:
              #   "true": adds k8s node to the "Root clients" field of the NFS export
              #   "false": adds k8s node to the "Clients" field of the NFS export
              # Optional: true
              # Default value: "false"
              RootClientEnabled: "false"

              # Name of PowerScale cluster, where pv will be provisioned.
              # This name should match with name of one of the cluster configs in isilon-creds secret.
              # If this parameter is not specified, then default cluster config in isilon-creds secret
              # will be considered if available.
              # Optional: true
              # ClusterName: <cluster_name>

              # Sets the filesystem type which will be used to format the new volume
              # Optional: true
              # Default value: None
              # csi.storage.k8s.io/fstype: "nfs"

            # volumeBindingMode controls when volume binding and dynamic provisioning should occur.
            # Allowed values:
            #   Immediate: indicates that volume binding and dynamic provisioning occurs once the
            #   PersistentVolumeClaim is created
            #   WaitForFirstConsumer: will delay the binding and provisioning of a PersistentVolume
            #   until a Pod using the PersistentVolumeClaim is created
            # Default value: Immediate
            volumeBindingMode: Immediate
            # allowedTopologies helps scheduling pods on worker nodes which match all of below expressions.
            # If enableCustomTopology is set to true in helm values.yaml, then do not specify allowedTopologies
            # Change all instances of <ISILON_IP> to the IP of the PowerScale OneFS API server
            # allowedTopologies:
            #  - matchLabelExpressions:
            #      - key: csi-isilon.dellemc.com/<ISILON_IP>
            #        values:
            #          - csi-isilon.dellemc.com

            # specify additional mount options for when a Persistent Volume is being mounted on a node.
