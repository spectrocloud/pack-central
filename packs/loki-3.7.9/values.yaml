pack:
  content:
    images:
      - image: docker.io/grafana/loki:3.7.9
      - image: docker.io/grafana/loki-canary:3.7.9
      - image: docker.io/grafana/loki-helm-test:3.7.9
      - image: docker.io/nginx/nginx-unprivileged:1.31-alpine
      - image: docker.io/envoyproxy/envoy:distroless-v1.39.1
      - image: ghcr.io/jkroepke/access-log-exporter:1.0.2
      - image: docker.io/library/memcached:1.6.45-alpine
      - image: docker.io/prom/memcached-exporter:v0.18.0
      - image: docker.io/kiwigrid/k8s-sidecar:2.14.3
      - image: registry.k8s.io/kubectl:v1.37.0

    charts:
      - repo: https://grafana-community.github.io/helm-charts
        name: loki
        version: 21.2.2

  namespace: "loki"

charts:
  loki:

    deploymentMode: Monolithic

    commonLabels:
      labelA: valueA
      labelB: valueB

    loki:
      auth_enabled: false

      image:
        registry: docker.io
        repository: grafana/loki
        tag: "3.7.9"

      commonConfig:
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: s3
        s3:
          endpoint: FIXME
          accessKeyId: FIXME
          secretAccessKey: FIXME

      tracing:
        enabled: true

      querier:
        max_concurrent: 2

    singleBinary:
      replicas: 1

      resources:
        limits:
          cpu: 3
          memory: 4Gi
        requests:
          cpu: 2
          memory: 2Gi

      extraEnv:
        - name: GOMEMLIMIT
          value: 3750MiB

    chunksCache:
      writebackSizeLimit: 10MB

    ingester:
      replicas: 0

    querier:
      replicas: 0
      maxUnavailable: 2

    queryFrontend:
      replicas: 0
      maxUnavailable: 1

    queryScheduler:
      replicas: 0

    distributor:
      replicas: 0
      maxUnavailable: 2

    compactor:
      replicas: 0

    indexGateway:
      replicas: 0
      maxUnavailable: 1

    bloomPlanner:
      replicas: 0

    bloomBuilder:
      replicas: 0

    bloomGateway:
      replicas: 0

    backend:
      replicas: 0

    read:
      replicas: 0

    write:
      replicas: 0

    gateway:
      enabled: true

      image:
        registry: docker.io
        repository: nginx/nginx-unprivileged
        tag: "1.31-alpine"

    lokiCanary:
      image:
        registry: docker.io
        repository: grafana/loki-canary
        tag: "3.7.9"

    test:
      image:
        registry: docker.io
        repository: grafana/loki-helm-test
        tag: "3.7.9"

    memcached:
      image:
        registry: docker.io
        repository: memcached
        tag: "1.6.45-alpine"

    memcachedExporter:
      image:
        registry: docker.io
        repository: prom/memcached-exporter
        tag: "v0.18.0"

    sidecar:
      image:
        registry: docker.io
        repository: kiwigrid/k8s-sidecar
        tag: "2.14.3"