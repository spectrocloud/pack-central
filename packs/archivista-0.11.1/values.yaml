pack:
  namespace: "archivista"
  content:
    images:
      - image: ghcr.io/in-toto/archivista:0.11.1

charts:
  archivista:
    # Copyright 2023 The Archivista Contributors
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #      http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.
    replicaCount: 1

    image:
      repository: ghcr.io/in-toto/archivista
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: "0.11.1"

    nameOverride: ""
    fullnameOverride: ""

    serviceAccount:
      create: false
      annotations: {}
      # The name of the service account to use.
      # If not set and create is true, a name is generated using the fullname template
      name: ""

    podAnnotations: {}

    podSecurityContext:
      fsGroup: 2000

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
      # readOnlyRootFilesystem: true  # habilitar solo si se valida que Archivista no requiere escritura local

    deployment:
      ## Bypasses entrypoint.sh's Atlas migration step, which fails to parse a MySQL
      ## connection string containing an explicit tcp(host:port) address (see README
      ## "MySQL connection string caveat" for details). Requires migrations to have been
      ## applied out-of-band beforehand (temporarily unset this and use a connection
      ## string without tcp(...) to let migrations run once).
      command: ["/bin/archivista"]

      env:
        - name: ARCHIVISTA_SQL_STORE_BACKEND
          value: "MYSQL"
        - name: ARCHIVISTA_STORAGE_BACKEND
          value: "BLOB"
        - name: ARCHIVISTA_BLOB_STORE_ENDPOINT
          value: "archivista-minio:9000"
        - name: ARCHIVISTA_BLOB_STORE_USE_TLS
          value: "FALSE"
        - name: ARCHIVISTA_BLOB_STORE_BUCKET_NAME
          value: "attestations"

      ## Allows the specification of a configmap or secret to set all key-value pairs as environment variables for Archivista
      envFrom:
        - secretRef:
            name: archivista-credentials

    service:
      type: ClusterIP
      port: 8082

    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: archivista.localhost
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []
      #  - secretName: chart-example-tls
      #    hosts:
      #      - archivista.localhost

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80

    nodeSelector: {}

    tolerations: []

    affinity: {}
