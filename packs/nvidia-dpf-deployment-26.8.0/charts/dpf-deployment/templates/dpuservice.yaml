# DPUService (svc.dpu.nvidia.com/v1alpha1, DPF v26.8.0).
# 26.8 CEL: a NEW DPUService with deployInCluster false/unset MUST set
# security.privileged (existing objects are grandfathered); deployInCluster true
# must NOT set it. With DPFOperatorConfig security.privilegedPodEnforcement
# (default true) a service only gets privileged pods when privileged: true.
# This template fails the render instead of letting admission reject the object.
{{- range $conf := .Values.dpuServices }}
{{- $dic := and (hasKey $conf "deployInCluster") $conf.deployInCluster }}
{{- $priv := dig "security" "privileged" "unset" $conf }}
{{- if and (not $dic) (eq (toString $priv) "unset") }}
{{- fail (printf "dpf-deployment: dpuServices[%s] needs security.privileged (true|false): required by DPF 26.8 when deployInCluster is false" $conf.name) }}
{{- end }}
---
apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUService
metadata:
  name: {{ $conf.name | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  {{- if $conf.dpuClusterSelector }}
  dpuClusterSelector: {{ $conf.dpuClusterSelector | toYaml | nindent 4 }}
  {{- end }}
  {{- if $conf.configPorts }}
  configPorts: {{ $conf.configPorts | toYaml | nindent 4 }}
  {{- end }}
  {{- if $conf.deployInCluster }}
  deployInCluster: {{ $conf.deployInCluster }}
  {{- end }}
  {{- if $conf.helmChart }}
  helmChart: {{ $conf.helmChart | toYaml | nindent 4 }}
  {{- end }}
  {{- if $conf.interfaces }}
  interfaces: {{ $conf.interfaces | toYaml | nindent 4 }}
  {{- end }}
  {{- if $conf.paused }}
  paused: {{ $conf.paused }}
  {{- end }}
  {{- if $conf.security }}
  security: {{ $conf.security | toYaml | nindent 4 }}
  {{- end }}
  {{- if $conf.serviceDaemonSet }}
  serviceDaemonSet: {{ $conf.serviceDaemonSet | toYaml | nindent 4 }}
  {{- end }}
  {{- if $conf.serviceID }}
  serviceID: {{ $conf.serviceID }}
  {{- end }}
{{- end }}
