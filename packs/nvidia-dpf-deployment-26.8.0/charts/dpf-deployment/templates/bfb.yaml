# BFB - the BlueField bitstream to flash onto the DPU. Required for BOTH ZT and HT.
# The bitstream is selected by the spec (.Values.bfb), e.g. for 26.8.0:
#   url: https://content.mellanox.com/BlueField/BFBs/Ubuntu24.04/bf-bundle-3.5.0-89_26.07_ubuntu-24.04_prod.bfb
# 26.8 adds optional spec.fileName and spec.versions {bsp,doca,uefi,atf} (all four
# or none; once set they cannot be removed).
# Object name follows NVIDIA's reference (bf-bundle-$TAG). DPUSets/DPUDeployments
# reference it by name, so anything created outside this chart (DPU Manager) must
# use the same name; override with .Values.bfbName only when that is easier.
{{- if .Values.bfb }}
apiVersion: provisioning.dpu.nvidia.com/v1alpha1
kind: BFB
metadata:
  name: {{ .Values.bfbName | default "bf-bundle-v26.8.0" }}
  namespace: dpf-operator-system
spec: {{ .Values.bfb | toYaml | nindent 2 }}
{{- end }}
